# Action register: core plugins (ewiki.plugin.v1.Action, see
# sdk/proto/ewiki/plugin/v1/action.proto).
actions:
  - id: core.plugins.sources.check
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/admin/plugins/origin
    summary:
      text:
        en: Show the origin level of a plugin source before installing
        de: Herkunftsstufe einer Plugin-Quelle vor der Installation anzeigen
    permission: {key: core.plugins.manage, scope: SCOPE_GLOBAL, instance: true}
    body:
      json: '{"type": "object", "required": ["source"], "properties": {"source": {"type": "string"}}}'
    success_status: 200
    cli: {command: [plugin, sources, check], args: [source], builtin: true}
    ui: {entry: /admin/plugins}
    examples:
      - name: default
        as: admin
        body_json: '{"source": "${local_plugin:acme.check${unique}}"}'
        expect_json: '{"level": "external", "allowed": true}'
  - id: core.plugins.sources.list
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/admin/plugins/sources
    summary:
      text:
        en: List the trusted sources for core plugins
        de: Vertrauenswürdige Quellen für Core-Plugins auflisten
    permission: {key: core.plugins.manage, scope: SCOPE_GLOBAL, instance: true}
    success_status: 200
    cli: {command: [plugin, sources, list], builtin: true}
    ui: {entry: /admin/plugins}
    examples:
      - name: default
      - name: refused
        as: outsider
        status: 403
  - id: core.plugins.sources.add
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/admin/plugins/sources
    summary:
      text:
        en: Add a trusted source for core plugins
        de: Vertrauenswürdige Quelle für Core-Plugins eintragen
    permission: {key: core.plugins.manage, scope: SCOPE_GLOBAL, instance: true}
    body:
      json: '{"type": "object", "required": ["prefix"], "properties": {"prefix": {"type": "string", "minLength": 2, "maxLength": 500}, "note": {"type": "string", "maxLength": 200}}}'
    success_status: 201
    safety: {changes: true, recent_sign_in: true, idempotent: true, audit_event: plugin.sources.add}
    cli: {command: [plugin, sources, add], args: [prefix], builtin: true}
    ui: {entry: /admin/plugins, control: {text: {en: Add, de: Eintragen}}}
    examples:
      - name: default
        as: admin
        body_json: '{"prefix": "${plugin_root}/team${unique}", "note": "Our team"}'
        expect_json: '{"note": "Our team"}'
      - name: whole_host
        as: admin
        body_json: '{"prefix": "https://git.example.com"}'
        status: 400
  - id: core.plugins.sources.remove
    category: CATEGORY_ACTION
    method: DELETE
    path: /api/v1/admin/plugins/sources
    summary:
      text:
        en: Remove a trusted source for core plugins
        de: Vertrauenswürdige Quelle für Core-Plugins entfernen
    permission: {key: core.plugins.manage, scope: SCOPE_GLOBAL, instance: true}
    query:
      json: '{"type": "object", "required": ["prefix"], "properties": {"prefix": {"type": "string"}}}'
    success_status: 204
    safety: {changes: true, idempotent: true, audit_event: plugin.sources.remove}
    cli: {command: [plugin, sources, remove], args: [prefix], builtin: true}
    ui: {entry: /admin/plugins}
    examples:
      - name: default
        as: admin
        given: [core.plugins.sources.add#default]
        query_json: '{"prefix": "${given.core.plugins.sources.add#default.prefix}"}'
  - id: core.plugins.credentials.list
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/admin/plugins/credentials
    summary:
      text:
        en: List the access data of plugin sources (without tokens)
        de: Zugangsdaten für Plugin-Quellen auflisten (ohne Token)
    permission: {key: core.plugins.manage, scope: SCOPE_GLOBAL, instance: true}
    success_status: 200
    cli: {command: [plugin, credentials, list]}
    ui: {entry: /admin/plugins}
    examples:
      - name: default
        as: admin
  - id: core.plugins.credentials.set
    category: CATEGORY_ACTION
    method: PUT
    path: /api/v1/admin/plugins/credentials
    summary:
      text:
        en: Set the access data for plugin sources below an https address (private repositories)
        de: Zugangsdaten für Plugin-Quellen unter einer https-Adresse setzen (private Repositorys)
    permission: {key: core.plugins.manage, scope: SCOPE_GLOBAL, instance: true}
    body:
      json: '{"type": "object", "required": ["prefix", "token"], "properties": {"prefix": {"type": "string", "minLength": 9, "maxLength": 500}, "username": {"type": "string", "maxLength": 200}, "token": {"type": "string", "minLength": 1, "maxLength": 4096}, "note": {"type": "string", "maxLength": 200}}}'
    success_status: 200
    safety: {changes: true, recent_sign_in: true, idempotent: true, audit_event: plugin.credentials.set, secret_fields: [token]}
    cli: {command: [plugin, credentials, set]}
    ui: {entry: /admin/plugins, control: {text: {en: Save access data, de: Zugangsdaten speichern}}}
    examples:
      - name: default
        as: admin
        body_json: '{"prefix": "https://git.example.com/team${unique}", "token": "example-token", "note": "Team"}'
        expect_json: '{"username": "x-access-token", "token_set": true, "from_env": false, "note": "Team"}'
      - name: environment_reference
        as: admin
        body_json: '{"prefix": "https://git.example.com/team${unique}", "token": "${EWIKI_DATABASE_URL}"}'
        status: 400
      - name: without_tls
        as: admin
        body_json: '{"prefix": "http://git.example.com/team", "token": "example-token"}'
        status: 400
  - id: core.plugins.credentials.remove
    category: CATEGORY_ACTION
    method: DELETE
    path: /api/v1/admin/plugins/credentials
    summary:
      text:
        en: Remove the access data of plugin sources
        de: Zugangsdaten für Plugin-Quellen entfernen
    permission: {key: core.plugins.manage, scope: SCOPE_GLOBAL, instance: true}
    query:
      json: '{"type": "object", "required": ["prefix"], "properties": {"prefix": {"type": "string"}}}'
    success_status: 204
    safety: {changes: true, idempotent: true, audit_event: plugin.credentials.remove}
    cli: {command: [plugin, credentials, remove]}
    ui: {entry: /admin/plugins}
    examples:
      - name: default
        as: admin
        given: [core.plugins.credentials.set#default]
        query_json: '{"prefix": "${given.core.plugins.credentials.set#default.prefix}"}'
  - id: core.plugins.sources.external
    category: CATEGORY_ACTION
    method: PUT
    path: /api/v1/admin/plugins/sources/external
    summary:
      text:
        en: Allow or forbid core plugins from external sources
        de: Core-Plugins aus externen Quellen erlauben oder verbieten
    permission: {key: core.plugins.manage, scope: SCOPE_GLOBAL, instance: true}
    body:
      json: '{"type": "object", "required": ["allow"], "properties": {"allow": {"type": "boolean"}}}'
    success_status: 200
    safety: {changes: true, idempotent: true}
    cli: {command: [plugin, sources, external], builtin: true}
    ui: {entry: /admin/plugins}
    examples:
      # forbidding needs no fresh sign-in (allowing does: TestCorePluginOrigin)
      - name: forbid
        as: admin
        body_json: '{"allow": false}'
        expect_json: '{"allow": false}'

# Action register (ewiki.plugin.v1.Action, see sdk/proto/ewiki/plugin/v1/action.proto).
actions:
  - id: core.categories.list
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/categories
    summary:
      text:
        en: List categories (only what you may see)
        de: "Kategorien auflisten (nur, was Sie sehen dürfen)"
    public: true
    cli: {command: [category, list]}
    ui: {entry: /}
    examples:
      - name: default
        given: ['core.categories.create#default']
        as: guest
  - id: core.categories.tree
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/categories/tree
    summary:
      text:
        en: Show the tree of categories (only what you may see)
        de: "Baum der Kategorien anzeigen (nur, was Sie sehen dürfen)"
    public: true
    cli: {command: [category, tree]}
    ui: {entry: /}
    examples:
      - name: default
        as: guest
  - id: core.categories.get
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/categories/{id}
    summary:
      text:
        en: Show a category with its elements
        de: Kategorie mit ihren Elementen anzeigen
    permission: {key: core.category.view, scope: SCOPE_CATEGORY, category_param: "id"}
    cli: {command: [category, show], args: [id]}
    ui: {entry: /c/:id}
    examples:
      - name: default
        given: ['core.categories.create#default']
        as: member
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
        expect_json: '{"category": {"id": ${given.core.categories.create#default.id}}}'
  - id: core.categories.create
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/categories
    summary:
      text:
        en: Create a category (needs manage on the parent as well)
        de: Kategorie anlegen (braucht zusätzlich Verwalten der übergeordneten)
    permission: {key: core.categories.admin, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [category, create]}
    ui: {entry: /}
    examples:
      - name: default
        as: member
        body_json: '{"titles": {"en": "Example ${unique}"}}'
        status: 201
      - name: second
        as: member
        body_json: '{"titles": {"en": "Second ${unique}"}}'
        status: 201
  - id: core.categories.update
    category: CATEGORY_ACTION
    method: PUT
    path: /api/v1/categories/{id}
    summary:
      text:
        en: "Change a category (texts, settings, display)"
        de: "Kategorie ändern (Texte, Einstellungen, Darstellung)"
    permission: {key: core.category.manage, scope: SCOPE_CATEGORY, category_param: "id"}
    safety: {changes: true}
    cli: {command: [category, update], args: [id]}
    ui: {entry: /c/:id/settings}
    examples:
      - name: default
        given: ['core.categories.create#default']
        as: member
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
        body_json: '{"titles": {"en": "Renamed"}}'
        expect_json: '{"titles": {"en": "Renamed"}}'
      - name: feed
        given: ['core.categories.create#default']
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
        body_json: '{"feed": "on"}'
      - name: short
        given: ['core.categories.create#default']
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
        body_json: '{"short_url": "ex-${unique}"}'
  - id: core.categories.delete
    category: CATEGORY_ACTION
    method: DELETE
    path: /api/v1/categories/{id}
    summary:
      text:
        en: Move a category to the trash (needs manage on it as well)
        de: Kategorie in den Papierkorb legen (braucht zusätzlich Verwalten)
    permission: {key: core.categories.admin, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [category, delete], args: [id]}
    ui: {entry: /c/:id/settings}
    examples:
      - name: default
        given: ['core.categories.create#default']
        as: admin
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
        status: 204
  - id: core.categories.move
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/categories/{id}/move
    summary:
      text:
        en: Move a category to another parent or position
        de: Kategorie unter eine andere Kategorie oder an eine andere Stelle verschieben
    permission: {key: core.categories.admin, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [category, move], args: [id]}
    ui: {entry: /c/:id/settings}
    examples:
      - name: default
        given: ['core.categories.create#default', 'core.categories.create#second']
        as: admin
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
        body_json: '{"parent_id": ${given.core.categories.create#second.id}, "position": 0}'
  - id: core.categories.duplicate
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/categories/{id}/duplicate
    summary:
      text:
        en: Duplicate a category with its elements
        de: Kategorie mit ihren Elementen duplizieren
    permission: {key: core.categories.admin, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [category, duplicate], args: [id]}
    ui: {entry: /c/:id/settings}
    examples:
      - name: default
        given: ['core.categories.create#default']
        as: admin
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
        body_json: '{"parent_id": 0}'
  - id: core.categories.reorder
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/categories/{id}/reorder
    summary:
      text:
        en: Change the order of the subcategories and elements
        de: Reihenfolge von Unterkategorien und Elementen ändern
    permission: {key: core.categories.admin, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [category, reorder], args: [id]}
    ui: {entry: /c/:id}
    examples:
      - name: default
        given: ['core.categories.create#default', 'core.categories.create#second']
        as: admin
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
        body_json: '{"order": []}'
        status: 204
  - id: core.categories.space
    category: CATEGORY_ACTION
    method: PUT
    path: /api/v1/categories/{id}/space
    summary:
      text:
        en: Make a category a space or change its space settings
        de: Kategorie zum Bereich machen oder Bereichs-Einstellungen ändern
    permission: {key: core.category.manage, scope: SCOPE_CATEGORY, category_param: "id"}
    safety: {changes: true}
    cli: {command: [category, space], args: [id]}
    ui: {entry: /c/:id/settings}
    examples:
      - name: default
        given: ['core.categories.create#default']
        as: member
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
        body_json: '{"key": "SP${unique}"}'
      - name: template
        given: ['core.categories.create#default']
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
        body_json: '{"key": "TPL${unique}", "is_template": true}'
  - id: core.categories.archive
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/categories/{id}/archive
    summary:
      text:
        en: Archive a space or take it out of the archive
        de: Bereich archivieren oder aus dem Archiv holen
    permission: {key: core.category.manage, scope: SCOPE_CATEGORY, category_param: "id"}
    safety: {changes: true}
    cli: {command: [category, archive], args: [id]}
    ui: {entry: /c/:id/settings}
    examples:
      - name: default
        given: ['core.categories.create#default']
        as: member
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
        body_json: '{"archived": true}'
  - id: core.categories.translate
    category: CATEGORY_ACTION
    method: PUT
    path: /api/v1/categories/{id}/translations/{lang}
    summary:
      text:
        en: Translate the texts of a category
        de: Texte einer Kategorie übersetzen
    permission: {key: core.category.manage, scope: SCOPE_CATEGORY, category_param: "id"}
    safety: {changes: true}
    cli: {command: [category, translate], builtin: true}
    ui: {entry: /c/:id/settings}
    examples:
      - name: default
        given: ['core.categories.create#default']
        as: member
        path_params_json: '{"id": "${given.core.categories.create#default.id}", "lang": "de"}'
        body_json: '{"title": "Beispiel", "confirm": true}'
  - id: core.categories.acl.list
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/categories/{id}/acl
    summary:
      text:
        en: List the permission rules of a category
        de: Rechte-Regeln einer Kategorie auflisten
    permission: {key: core.category.manage, scope: SCOPE_CATEGORY, category_param: "id"}
    cli: {command: [category, acl, list], args: [id]}
    ui: {entry: /c/:id/settings}
    examples:
      - name: default
        given: ['core.categories.create#default']
        as: member
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
  - id: core.categories.acl.add
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/categories/{id}/acl
    summary:
      text:
        en: Add a permission rule to a category
        de: Rechte-Regel zu einer Kategorie hinzufügen
    permission: {key: core.category.manage, scope: SCOPE_CATEGORY, category_param: "id"}
    safety: {changes: true}
    cli: {command: [category, acl, add], args: [id]}
    ui: {entry: /c/:id/settings}
    examples:
      - name: default
        given: ['core.categories.create#default']
        as: member
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
        body_json: '{"subject_type": "authenticated", "permissions": 1}'
        status: 201
      - name: user_view
        given: ['core.categories.create#default', 'core.users.create#default']
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
        body_json: '{"subject_type": "user", "subject_id": ${given.core.users.create#default.id}, "permissions": 1}'
        status: 201
      - name: self_view
        given: ['core.categories.create#default']
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
        body_json: '{"subject_type": "user", "subject_id": ${self.id}, "permissions": 1}'
        status: 201
  - id: core.categories.acl.update
    category: CATEGORY_ACTION
    method: PUT
    path: /api/v1/acl/{id}
    summary:
      text:
        en: Change a permission rule (needs manage on its category)
        de: Rechte-Regel ändern (braucht Verwalten ihrer Kategorie)
    signed_in: true
    safety: {changes: true}
    cli: {command: [category, acl, update], args: [id]}
    ui: {entry: /c/:id/settings}
    examples:
      - name: default
        given: ['core.categories.acl.add#default']
        as: admin
        path_params_json: '{"id": "${given.core.categories.acl.add#default.id}"}'
        body_json: '{"subject_type": "authenticated", "permissions": 3}'
  - id: core.categories.acl.remove
    category: CATEGORY_ACTION
    method: DELETE
    path: /api/v1/acl/{id}
    summary:
      text:
        en: Remove a permission rule (needs manage on its category)
        de: Rechte-Regel entfernen (braucht Verwalten ihrer Kategorie)
    signed_in: true
    safety: {changes: true}
    cli: {command: [category, acl, remove], args: [id]}
    ui: {entry: /c/:id/settings}
    examples:
      - name: default
        given: ['core.categories.acl.add#default']
        as: admin
        path_params_json: '{"id": "${given.core.categories.acl.add#default.id}"}'
        status: 204
  - id: core.categories.history
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/categories/{id}/history
    summary:
      text:
        en: Show the change history of a category
        de: Änderungsverlauf einer Kategorie anzeigen
    permission: {key: core.category.view, scope: SCOPE_CATEGORY, category_param: "id"}
    cli: {command: [category, history], args: [id]}
    ui: {entry: /c/:id/settings}
    examples:
      - name: default
        given: ['core.elements.create#default']
        as: member
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
  - id: core.categories.rollback
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/categories/{id}/rollback
    summary:
      text:
        en: Set a category with its elements back to an earlier point in time (needs edit and delete)
        de: Kategorie mit ihren Elementen auf einen früheren Zeitpunkt zurücksetzen (braucht Bearbeiten und Löschen)
    permission: {key: core.category.delete, scope: SCOPE_CATEGORY, category_param: "id"}
    safety: {changes: true}
    cli: {command: [category, rollback], args: [id]}
    ui: {entry: /c/:id/settings}
    examples:
      - name: default
        given: ['core.elements.create#default']
        as: admin
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
        body_json: '{"at": "2026-01-01T00:00:00Z"}'
  - id: core.categories.export
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/categories/{id}/export
    summary:
      text:
        en: Export a category with its elements and files (needs manage)
        de: Kategorie mit Elementen und Dateien exportieren (braucht Verwalten)
    permission: {key: core.category.manage, scope: SCOPE_CATEGORY, category_param: "id"}
    cli: {command: [category, export], args: [id]}
    ui: {entry: /c/:id/settings}
    examples:
      - name: default
        given: ['core.elements.create#default']
        as: member
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
  - id: core.categories.import
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/categories/import
    summary:
      text:
        en: Import an exported category
        de: Exportierte Kategorie importieren
    permission: {key: core.categories.admin, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [category, import]}
    ui: {entry: /c/:id/settings}
    examples:
      - name: default
        given: ['core.categories.export#default']
        as: member
        body_text: '${given.core.categories.export#default.$raw}'
        status: 201
  - id: core.categories.insights
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/categories/{id}/insights
    summary:
      text:
        en: Show views and activity of a category
        de: Aufrufe und Aktivität einer Kategorie anzeigen
    permission: {key: core.category.manage, scope: SCOPE_CATEGORY, category_param: "id"}
    cli: {command: [category, insights], args: [id]}
    ui: {entry: /c/:id/settings}
    examples:
      - name: default
        given: ['core.categories.create#default']
        as: member
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
  - id: core.categories.access_requests
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/categories/{id}/access-requests
    summary:
      text:
        en: List the open access requests of a category
        de: Offene Zugriffsanfragen einer Kategorie auflisten
    permission: {key: core.category.manage, scope: SCOPE_CATEGORY, category_param: "id"}
    cli: {command: [category, access-requests], args: [id]}
    ui: {entry: /c/:id/settings}
    examples:
      - name: default
        given: ['core.categories.create#default']
        as: member
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
      - name: open
        given: ['core.categories.create#default', 'core.access.request#other']
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
  - id: core.elements.list
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/elements
    summary:
      text:
        en: List elements with filters (only what you may see)
        de: "Elemente mit Filtern auflisten (nur, was Sie sehen dürfen)"
    public: true
    cli: {command: [element, list]}
    ui: {entry: /search}
    examples:
      - name: default
        as: guest
  - id: core.elements.get
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/elements/{id}
    summary:
      text:
        en: Show an element
        de: Element anzeigen
    permission: {key: core.category.view, scope: SCOPE_CATEGORY, category_param: "element:id"}
    cli: {command: [element, show], args: [id]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['core.elements.create#default']
        as: member
        path_params_json: '{"id": "${given.core.elements.create#default.id}"}'
        expect_json: '{"type": "core.html", "rev": 1, "category_id": ${given.core.categories.create#default.id}}'
  - id: core.elements.create
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/elements
    summary:
      text:
        en: Create an element in a category
        de: Element in einer Kategorie anlegen
    permission: {key: core.category.create, scope: SCOPE_CATEGORY, category_param: "category_id"}
    safety: {changes: true}
    cli: {command: [element, create]}
    ui: {entry: /c/:id/new}
    examples:
      - name: default
        given: ['core.categories.create#default']
        as: member
        body_json: '{"category_id": ${given.core.categories.create#default.id}, "type": "core.html", "title": "Page ${unique}", "body": {"format": "html", "source": "<p>Hello</p>"}}'
        status: 201
      - name: blog
        given: ['core.categories.create#default']
        body_json: '{"category_id": ${given.core.categories.create#default.id}, "type": "content.blog", "title": "Blog ${unique}", "body": {"category_id": ${given.core.categories.create#default.id}, "feed": true}}'
        status: 201
      - name: faq
        given: ['core.categories.create#default']
        body_json: '{"category_id": ${given.core.categories.create#default.id}, "type": "content.faq", "title": "Faq ${unique}", "body": {"category_id": ${given.core.categories.create#default.id}, "feed": true}}'
        status: 201
      - name: calendar
        given: ['core.categories.create#default']
        body_json: '{"category_id": ${given.core.categories.create#default.id}, "type": "content.events", "title": "Calendar ${unique}", "body": {"view": "list", "ical": true}}'
        status: 201
      - name: form
        given: ['core.categories.create#default']
        body_json: '{"category_id": ${given.core.categories.create#default.id}, "type": "content.forms", "title": "Form ${unique}", "body": {"intro": "Write to us.", "submit_label": "Send", "success_message": "Thanks!", "fields": [{"id": "name", "type": "text", "label": "Your name", "required": true}, {"id": "doc", "type": "file", "label": "Document", "accept": [".txt"], "max_files": 1, "max_size_mb": 1}], "targets": {"store": true}}}'
        status: 201
      - name: team
        given: ['core.categories.create#default', 'core.groups.create#default']
        body_json: '{"category_id": ${given.core.categories.create#default.id}, "type": "content.team", "title": "Team ${unique}", "body": {"groups": [${given.core.groups.create#default.id}], "fields": ["job_title", "email"], "layout": "cards"}}'
        status: 201
      - name: workflow
        given: ['core.categories.create#default']
        body_json: '{"category_id": ${given.core.categories.create#default.id}, "type": "workflow.process", "title": "Request ${unique}", "body": {"description": "Example request", "fields": [{"id": "subject", "label": "Subject", "type": "text"}, {"id": "doc", "label": "Document", "type": "file"}], "steps": [{"id": "check", "name": "Check", "assignee": {"type": "role", "value": "Administrators"}, "actions": [{"id": "ok", "label": "OK", "next": "done"}]}, {"id": "done", "name": "Done", "actions": [], "outcome": "success"}], "triggers": [{"id": "hook", "type": "webhook", "title": "From outside"}]}}'
        status: 201
      - name: attachment
        given: ['core.categories.create#default', 'core.files.upload#default']
        body_json: '{"category_id": ${given.core.categories.create#default.id}, "type": "core.attachment", "title": "Notes ${unique}", "body": {"file": {"hash": "${given.core.files.upload#default.hash}", "name": "notes.txt", "mime": "text/plain", "size": 12}, "description": "Example file"}}'
        status: 201
      - name: propdb
        given: ['core.categories.create#default']
        body_json: '{"category_id": ${given.core.categories.create#default.id}, "type": "content.propdb", "title": "Rooms ${unique}", "body": {"source": "category:${given.core.categories.create#default.id}"}}'
        status: 201
      - name: report_page
        given: ['core.categories.create#default']
        body_json: '{"category_id": ${given.core.categories.create#default.id}, "type": "core.html", "title": "Report ${unique}", "body": {"format": "html", "source": "<div data-macro=\"properties\" data-params=''{\"source\":\"category:${given.core.categories.create#default.id}+sub\",\"title\":\"Rooms\"}''></div>"}}'
        status: 201
      - name: with_image
        given: ['core.categories.create#default', 'core.files.upload#png']
        body_json: '{"category_id": ${given.core.categories.create#default.id}, "type": "core.html", "title": "Picture ${unique}", "body": {"format": "html", "source": "<p><img src=\"/api/v1/files/${given.core.files.upload#png.hash}\" alt=\"Dot\"></p>"}}'
        status: 201
      - name: signed_workflow
        given: ['core.categories.create#default']
        body_json: '{"category_id": ${given.core.categories.create#default.id}, "type": "workflow.process", "title": "Contract ${unique}", "body": {"description": "Contract", "fields": [], "steps": [{"id": "check", "name": "Check", "type": "task", "sign": "advanced", "assignee": {"type": "user", "value": "${self.name}"}, "actions": [{"id": "ok", "label": "Agree", "next": "done"}]}, {"id": "done", "name": "Done", "type": "end", "outcome": "success"}]}}'
        status: 201
      - name: link_workflow
        given: ['core.categories.create#default']
        body_json: '{"category_id": ${given.core.categories.create#default.id}, "type": "workflow.process", "title": "Leave ${unique}", "body": {"description": "Leave", "links": true, "fields": [], "steps": [{"id": "check", "name": "Check", "type": "task", "assignee": {"type": "user", "value": "${self.name}"}, "actions": [{"id": "ok", "label": "Approve", "next": "done"}]}, {"id": "done", "name": "Done", "type": "end", "outcome": "success"}]}}'
        status: 201
  - id: core.elements.update
    category: CATEGORY_ACTION
    method: PUT
    path: /api/v1/elements/{id}
    summary:
      text:
        en: Save an element (new version)
        de: Element speichern (neue Version)
    permission: {key: core.category.edit, scope: SCOPE_CATEGORY, category_param: "element:id"}
    safety: {changes: true}
    cli: {command: [element, update], args: [id]}
    ui: {entry: /e/:id/edit}
    examples:
      - name: default
        given: ['core.elements.create#default']
        as: member
        path_params_json: '{"id": "${given.core.elements.create#default.id}"}'
        body_json: '{"title": "Changed", "body": {"format": "html", "source": "<p>Changed</p>"}, "base_rev": 1}'
        expect_json: '{"rev": 2}'
  - id: core.elements.patch
    category: CATEGORY_ACTION
    method: PATCH
    path: /api/v1/elements/{id}
    summary:
      text:
        en: "Change single fields of an element (title, tags, properties)"
        de: "Einzelne Felder eines Elements ändern (Titel, Schlagwörter, Eigenschaften)"
    permission: {key: core.category.edit, scope: SCOPE_CATEGORY, category_param: "element:id"}
    safety: {changes: true}

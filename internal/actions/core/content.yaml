  - id: core.elements.create
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/elements
    success_status: 201
    summary:
      text:
        en: Create an element in a category (with via on behalf of an instance such as a blog, with its permissions)
        de: Element in einer Kategorie anlegen (mit via im Auftrag einer Instanz wie eines Blogs, mit deren Rechten)
    permission: {key: core.category.create, scope: SCOPE_CATEGORY, category_param: "category_id"}
    safety: {changes: true}
    cli: {command: [element, create]}
    ui: {entry: /c/:id/new}
    examples:
      - name: default
        given: ['core.categories.create#default']
        as: member
        body_json: '{"category_id": ${given.core.categories.create#default.id}, "type": "core.html", "title": "Page ${unique}", "body": {"format": "html", "source": "<p>Hello</p>"}}'
        status: 201
      - name: blog
        given: ['core.categories.create#default']
        body_json: '{"category_id": ${given.core.categories.create#default.id}, "type": "content.blog", "title": "Blog ${unique}", "body": {"category_id": ${given.core.categories.create#default.id}, "feed": true}}'
        status: 201
      - name: faq
        given: ['core.categories.create#default']
        body_json: '{"category_id": ${given.core.categories.create#default.id}, "type": "content.faq", "title": "Faq ${unique}", "body": {"category_id": ${given.core.categories.create#default.id}, "feed": true}}'
        status: 201
      # a post on behalf of the blog (its permissions instead of the page permissions)
      - name: blog_post
        given: ['core.elements.create#blog']
        body_json: '{"category_id": ${given.core.elements.create#blog.category_id}, "via": ${given.core.elements.create#blog.id}, "type": "core.html", "title": "Post ${unique}", "body": {"format": "html", "source": "<p>Hello blog</p>"}}'
        status: 201
        expect_json: '{"owner_instance": ${given.core.elements.create#blog.id}}'
      - name: faq_question
        given: ['core.elements.create#faq']
        body_json: '{"category_id": ${given.core.elements.create#faq.category_id}, "via": ${given.core.elements.create#faq.id}, "type": "core.html", "title": "Question ${unique}?", "body": {"format": "markdown", "source": "The answer."}}'
        status: 201
      # only into the categories of the instance, only its element types
      - name: via_outside
        given: ['core.elements.create#blog', 'core.categories.create#second']
        body_json: '{"category_id": ${given.core.categories.create#second.id}, "via": ${given.core.elements.create#blog.id}, "type": "core.html", "title": "Elsewhere", "body": {"format": "html", "source": "<p>x</p>"}}'
        status: 400
      - name: via_other_type
        given: ['core.elements.create#blog']
        body_json: '{"category_id": ${given.core.elements.create#blog.category_id}, "via": ${given.core.elements.create#blog.id}, "type": "content.blog", "title": "Blog in a blog", "body": {"category_id": ${given.core.elements.create#blog.category_id}}}'
        status: 400
      - name: via_page
        given: ['core.elements.create#default']
        body_json: '{"category_id": ${given.core.elements.create#default.category_id}, "via": ${given.core.elements.create#default.id}, "type": "core.html", "title": "Via a page", "body": {"format": "html", "source": "<p>x</p>"}}'
        status: 400
      - name: calendar
        given: ['core.categories.create#default']
        body_json: '{"category_id": ${given.core.categories.create#default.id}, "type": "content.events", "title": "Calendar ${unique}", "body": {"view": "list", "ical": true}}'
        status: 201
      - name: form
        given: ['core.categories.create#default']
        body_json: '{"category_id": ${given.core.categories.create#default.id}, "type": "content.forms", "title": "Form ${unique}", "body": {"intro": "Write to us.", "submit_label": "Send", "success_message": "Thanks!", "fields": [{"id": "name", "type": "text", "label": "Your name", "required": true}, {"id": "doc", "type": "file", "label": "Document", "accept": [".txt"], "max_files": 1, "max_size_mb": 1}], "targets": {"store": true}}}'
        status: 201
      - name: team
        given: ['core.categories.create#default', 'core.groups.create#default']
        body_json: '{"category_id": ${given.core.categories.create#default.id}, "type": "content.team", "title": "Team ${unique}", "body": {"groups": [${given.core.groups.create#default.id}], "fields": ["job_title", "email"], "layout": "cards"}}'
        status: 201
      - name: workflow
        given: ['core.categories.create#default']
        body_json: '{"category_id": ${given.core.categories.create#default.id}, "type": "workflow.process", "title": "Request ${unique}", "body": {"description": "Example request", "fields": [{"id": "subject", "label": "Subject", "type": "text"}, {"id": "doc", "label": "Document", "type": "file"}], "steps": [{"id": "check", "name": "Check", "assignee": {"type": "role", "value": "Administrators"}, "actions": [{"id": "ok", "label": "OK", "next": "done"}]}, {"id": "done", "name": "Done", "actions": [], "outcome": "success"}], "triggers": [{"id": "hook", "type": "webhook", "title": "From outside"}]}}'
        status: 201
      - name: attachment
        given: ['core.categories.create#default', 'core.files.upload#default']
        body_json: '{"category_id": ${given.core.categories.create#default.id}, "type": "core.attachment", "title": "Notes ${unique}", "body": {"file": {"hash": "${given.core.files.upload#default.hash}", "name": "notes.txt", "mime": "text/plain", "size": 12}, "description": "Example file"}}'
        status: 201
      - name: propdb
        given: ['core.categories.create#default']
        body_json: '{"category_id": ${given.core.categories.create#default.id}, "type": "content.propdb", "title": "Rooms ${unique}", "body": {"source": "category:${given.core.categories.create#default.id}"}}'
        status: 201
      - name: report_page
        given: ['core.categories.create#default']
        body_json: '{"category_id": ${given.core.categories.create#default.id}, "type": "core.html", "title": "Report ${unique}", "body": {"format": "html", "source": "<div data-macro=\"properties\" data-params=''{\"source\":\"category:${given.core.categories.create#default.id}+sub\",\"title\":\"Rooms\"}''></div>"}}'
        status: 201
      - name: with_image
        given: ['core.categories.create#default', 'core.files.upload#png']
        body_json: '{"category_id": ${given.core.categories.create#default.id}, "type": "core.html", "title": "Picture ${unique}", "body": {"format": "html", "source": "<p><img src=\"/api/v1/files/${given.core.files.upload#png.hash}\" alt=\"Dot\"></p>"}}'
        status: 201
      - name: signed_workflow
        given: ['core.categories.create#default']
        body_json: '{"category_id": ${given.core.categories.create#default.id}, "type": "workflow.process", "title": "Contract ${unique}", "body": {"description": "Contract", "fields": [], "steps": [{"id": "check", "name": "Check", "type": "task", "sign": "advanced", "assignee": {"type": "user", "value": "${self.name}"}, "actions": [{"id": "ok", "label": "Agree", "next": "done"}]}, {"id": "done", "name": "Done", "type": "end", "outcome": "success"}]}}'
        status: 201
      - name: link_workflow
        given: ['core.categories.create#default']
        body_json: '{"category_id": ${given.core.categories.create#default.id}, "type": "workflow.process", "title": "Leave ${unique}", "body": {"description": "Leave", "links": true, "fields": [], "steps": [{"id": "check", "name": "Check", "type": "task", "assignee": {"type": "user", "value": "${self.name}"}, "actions": [{"id": "ok", "label": "Approve", "next": "done"}]}, {"id": "done", "name": "Done", "type": "end", "outcome": "success"}]}}'
        status: 201

# Action register (ewiki.plugin.v1.Action, see sdk/proto/ewiki/plugin/v1/action.proto).
actions:
  - id: core.categories.list
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/categories
    success_status: 200
    summary:
      text:
        en: List categories (only what you may see)
        de: "Kategorien auflisten (nur, was Sie sehen dürfen)"
    public: true
    cli: {command: [category, list]}
    ui: {entry: /}
    examples:
      - name: default
        given: ['core.categories.create#default']
        as: guest
  - id: core.categories.tree
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/categories/tree
    success_status: 200
    summary:
      text:
        en: Show the tree of categories (only what you may see)
        de: "Baum der Kategorien anzeigen (nur, was Sie sehen dürfen)"
    public: true
    cli: {command: [category, tree]}
    ui: {entry: /}
    examples:
      - name: default
        as: guest
  - id: core.categories.get
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/categories/{id}
    success_status: 200
    summary:
      text:
        en: Show a category with its elements
        de: Kategorie mit ihren Elementen anzeigen
    permission: {key: core.category.view, scope: SCOPE_CATEGORY, category_param: "id"}
    cli: {command: [category, show], args: [id]}
    ui: {entry: /c/:id}
    examples:
      - name: default
        given: ['core.categories.create#default']
        as: member
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
        expect_json: '{"category": {"id": ${given.core.categories.create#default.id}}}'
  - id: core.categories.create
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/categories
    success_status: 201
    summary:
      text:
        en: Create a category (needs manage on the parent as well; with via the manage permission of the instance instead)
        de: Kategorie anlegen (braucht zusätzlich Verwalten der übergeordneten; mit via stattdessen das Verwalten-Recht der Instanz)
    permission: {key: core.categories.admin, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [category, create]}
    ui: {entry: /}
    examples:
      - name: default
        as: member
        body_json: '{"titles": {"en": "Example ${unique}"}}'
        status: 201
      - name: sub
        given: ['core.categories.create#default']
        as: admin
        body_json: '{"titles": {"en": "Sub ${unique}"}, "parent_id": ${given.core.categories.create#default.id}}'
        status: 201
      - name: second
        as: member
        body_json: '{"titles": {"en": "Second ${unique}"}}'
        status: 201
      # a section of a FAQ on behalf of the FAQ (its manage permission)
      - name: faq_section
        given: ['core.elements.create#faq']
        as: admin
        body_json: '{"titles": {"en": "Section ${unique}"}, "parent_id": ${given.core.elements.create#faq.category_id}, "via": ${given.core.elements.create#faq.id}}'
        status: 201
  - id: core.categories.settings.get
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/categories/{id}/settings
    success_status: 200
    summary:
      text:
        en: Show the settings of a category (language, logo, accent, own navigation, allowed types and macros) as set and as they apply, with where they come from
        de: Einstellungen einer Kategorie anzeigen (Sprache, Logo, Akzentfarbe, eigene Navigation, erlaubte Typen und Makros), eigene und geltende, mit Herkunft
    permission: {key: core.category.view, scope: SCOPE_CATEGORY, category_param: "id"}
    cli: {command: [category, settings, show], args: [id]}
    ui: {entry: /c/:id/settings}
    examples:
      - name: default
        given: ['core.categories.settings.set#default']
        as: member
        path_params_json: '{"id": "${given.core.categories.create#sub.id}"}'
        expect_json: '{"effective": {"language": "de"}}'
  - id: core.categories.settings.set
    category: CATEGORY_ACTION
    method: PUT
    path: /api/v1/categories/{id}/settings
    success_status: 200
    summary:
      text:
        en: Change the settings of a category, inherited by its subcategories (allowed types and macros can only be narrowed below)
        de: Einstellungen einer Kategorie ändern, vererbt an die Unterkategorien (erlaubte Typen und Makros lassen sich darunter nur einschränken)
    permission: {key: core.category.manage, scope: SCOPE_CATEGORY, category_param: "id"}
    safety: {changes: true}
    cli: {command: [category, settings, set], args: [id]}
    ui: {entry: /c/:id/settings}
    examples:
      - name: default
        given: ['core.categories.create#sub']
        as: member
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
        body_json: '{"language": "de", "allowed_types": ["core.html", "content.blog"]}'
      - name: wrong_accent
        given: ['core.categories.create#default']
        as: member
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
        body_json: '{"accent": "#ffffff"}'
        status: 400
  - id: core.categories.update
    category: CATEGORY_ACTION
    method: PUT
    path: /api/v1/categories/{id}
    success_status: 200
    summary:
      text:
        en: "Change a category (texts, settings, display)"
        de: "Kategorie ändern (Texte, Einstellungen, Darstellung)"
    permission: {key: core.category.manage, scope: SCOPE_CATEGORY, category_param: "id"}
    safety: {changes: true}
    cli: {command: [category, update], args: [id]}
    ui: {entry: /c/:id/settings}
    examples:
      - name: default
        given: ['core.categories.create#default']
        as: member
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
        body_json: '{"titles": {"en": "Renamed"}}'
        expect_json: '{"titles": {"en": "Renamed"}}'
      - name: feed
        given: ['core.categories.create#default']
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
        body_json: '{"feed": "on"}'
      - name: short
        given: ['core.categories.create#default']
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
        body_json: '{"short_url": "ex-${unique}"}'
      - name: editor_tools
        given: ['core.categories.create#default']
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
        body_json: '{"editor_tools": ["strong", "em", "link"]}'
        expect_json: '{"editor_tools": ["strong", "em", "link"]}'
      - name: editor_tools_unknown
        given: ['core.categories.create#default']
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
        body_json: '{"editor_tools": ["blink"]}'
        status: 400
  - id: core.categories.delete
    category: CATEGORY_ACTION
    method: DELETE
    path: /api/v1/categories/{id}
    success_status: 204
    summary:
      text:
        en: Move a category to the trash (needs manage on it as well)
        de: Kategorie in den Papierkorb legen (braucht zusätzlich Verwalten)
    permission: {key: core.categories.admin, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [category, delete], args: [id]}
    ui: {entry: /c/:id/settings}
    examples:
      - name: default
        given: ['core.categories.create#default']
        as: admin
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
        status: 204
  - id: core.categories.move
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/categories/{id}/move
    success_status: 200
    summary:
      text:
        en: Move a category to another parent or position
        de: Kategorie unter eine andere Kategorie oder an eine andere Stelle verschieben
    permission: {key: core.categories.admin, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [category, move], args: [id]}
    ui: {entry: /c/:id/settings}
    examples:
      - name: default
        given: ['core.categories.create#default', 'core.categories.create#second']
        as: admin
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
        body_json: '{"parent_id": ${given.core.categories.create#second.id}, "position": 0}'
  - id: core.categories.duplicate
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/categories/{id}/duplicate
    success_status: 201
    summary:
      text:
        en: Duplicate a category with its elements
        de: Kategorie mit ihren Elementen duplizieren
    permission: {key: core.categories.admin, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [category, duplicate], args: [id]}
    ui: {entry: /c/:id/settings}
    examples:
      - name: default
        given: ['core.categories.create#default']
        as: admin
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
        body_json: '{"parent_id": 0}'
  - id: core.categories.reorder
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/categories/{id}/reorder
    success_status: 204
    summary:
      text:
        en: Change the order of the subcategories and elements
        de: Reihenfolge von Unterkategorien und Elementen ändern
    permission: {key: core.categories.admin, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [category, reorder], args: [id]}
    ui: {entry: /c/:id}
    examples:
      - name: default
        given: ['core.categories.create#default', 'core.categories.create#second']
        as: admin
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
        body_json: '{"order": []}'
        status: 204
  - id: core.categories.space
    category: CATEGORY_ACTION
    method: PUT
    path: /api/v1/categories/{id}/space
    success_status: 200
    summary:
      text:
        en: Make a category a space or change its space settings
        de: Kategorie zum Bereich machen oder Bereichs-Einstellungen ändern
    permission: {key: core.category.manage, scope: SCOPE_CATEGORY, category_param: "id"}
    safety: {changes: true}
    cli: {command: [category, space], args: [id]}
    ui: {entry: /c/:id/settings}
    examples:
      - name: default
        given: ['core.categories.create#default']
        as: member
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
        body_json: '{"key": "SP${unique}"}'
      - name: template
        given: ['core.categories.create#default']
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
        body_json: '{"key": "TPL${unique}", "is_template": true}'
  - id: core.categories.archive
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/categories/{id}/archive
    success_status: 200
    summary:
      text:
        en: Archive a space or take it out of the archive
        de: Bereich archivieren oder aus dem Archiv holen
    permission: {key: core.category.manage, scope: SCOPE_CATEGORY, category_param: "id"}
    safety: {changes: true}
    cli: {command: [category, archive], args: [id]}
    ui: {entry: /c/:id/settings}
    examples:
      - name: default
        given: ['core.categories.create#default']
        as: member
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
        body_json: '{"archived": true}'
  - id: core.categories.translate
    category: CATEGORY_ACTION
    method: PUT
    path: /api/v1/categories/{id}/translations/{lang}
    success_status: 200
    summary:
      text:
        en: Translate the texts of a category
        de: Texte einer Kategorie übersetzen
    permission: {key: core.category.manage, scope: SCOPE_CATEGORY, category_param: "id"}
    safety: {changes: true}
    cli: {command: [category, translate], builtin: true}
    ui: {entry: /c/:id/settings}
    examples:
      - name: default
        given: ['core.categories.create#default']
        as: member
        path_params_json: '{"id": "${given.core.categories.create#default.id}", "lang": "de"}'
        body_json: '{"title": "Beispiel", "confirm": true}'
  - id: core.categories.acl.list
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/categories/{id}/acl
    success_status: 200
    summary:
      text:
        en: List the permission rules of a category
        de: Rechte-Regeln einer Kategorie auflisten
    permission: {key: core.category.manage, scope: SCOPE_CATEGORY, category_param: "id"}
    cli: {command: [category, acl, list], args: [id]}
    ui: {entry: /c/:id/settings}
    examples:
      - name: default
        given: ['core.categories.create#default']
        as: member
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
      # a rule for a person names the person, not only an id
      - name: user_names
        given: ['core.categories.acl.add#user_view']
        path_params_json: '{"id": "${given.core.categories.acl.add#user_view.category_id}"}'
        expect_json: '{"users": {"${given.core.categories.acl.add#user_view.subject_id}": {"display_name": "Example User"}}}'
  - id: core.categories.acl.add
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/categories/{id}/acl
    success_status: 201
    summary:
      text:
        en: Add a permission rule to a category
        de: Rechte-Regel zu einer Kategorie hinzufügen
    permission: {key: core.category.manage, scope: SCOPE_CATEGORY, category_param: "id"}
    safety: {changes: true}
    cli: {command: [category, acl, add], args: [id]}
    ui: {entry: /c/:id/settings}
    examples:
      - name: default
        given: ['core.categories.create#default']
        as: member
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
        body_json: '{"subject_type": "authenticated", "permissions": 1}'
        status: 201
      - name: user_view
        given: ['core.categories.create#default', 'core.users.create#default']
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
        body_json: '{"subject_type": "user", "subject_id": ${given.core.users.create#default.id}, "permissions": 1}'
        status: 201
      - name: self_view
        given: ['core.categories.create#default']
        path_params_json: '{"id": "${given.core.categories.create#default.id}"}'
        body_json: '{"subject_type": "user", "subject_id": ${self.id}, "permissions": 1}'
        status: 201
  - id: core.instances.rights.get
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/elements/{id}/rights
    success_status: 200
    summary:
      text:
        en: Show the permissions of an instance (a blog, a FAQ …) – the own ones; all rules with the manage permission of the instance
        de: Rechte einer Instanz (ein Blog, eine FAQ …) anzeigen – die eigenen; alle Regeln mit dem Verwalten-Recht der Instanz
    permission: {key: core.category.view, scope: SCOPE_CATEGORY, category_param: "element:id"}
    cli: {command: [instance, rights, show], args: [id]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['core.elements.create#blog']
        as: member
        path_params_json: '{"id": "${given.core.elements.create#blog.id}"}'
        expect_json: '{"type": "content.blog", "mine": [], "manage": false}'
      - name: manager
        given: ['core.instances.rights.set#default']
        path_params_json: '{"id": "${given.core.elements.create#blog.id}"}'
        expect_json: '{"manage": true, "rules": [{"subject_type": "user", "actions": ["content.blog.edit"]}]}'
  - id: core.instances.labels.get
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/elements/{id}/labels
    success_status: 200
    summary:
      text:
        en: The texts an instance may change (per active language the plugin's text and the instance's own) and whether you may change them
        de: Texte, die eine Instanz ändern darf (je aktiver Sprache der Text des Plugins und der eigene) und ob Sie sie ändern dürfen
    permission: {key: core.category.view, scope: SCOPE_CATEGORY, category_param: "element:id"}
    cli: {command: [instance, labels, show], args: [id]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['core.elements.create#blog']
        as: admin
        path_params_json: '{"id": "${given.core.elements.create#blog.id}"}'
        expect_json: '{"can_edit": true}'
  - id: core.instances.labels.set
    category: CATEGORY_ACTION
    method: PUT
    path: /api/v1/elements/{id}/labels
    success_status: 200
    summary:
      text:
        en: Change the texts of an instance per language (stored as UI texts "<key>@<plugin>/<id>"; empty = the plugin's text; needs the manage permission of the instance)
        de: Texte einer Instanz je Sprache ändern (gespeichert als Oberflächentexte „<key>@<plugin>/<id>“; leer = Text des Plugins; braucht das Verwalten-Recht der Instanz)
    signed_in: true
    safety: {changes: true}
    cli: {command: [instance, labels, set], args: [id]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['core.elements.create#blog']
        as: admin
        path_params_json: '{"id": "${given.core.elements.create#blog.id}"}'
        body_json: '{"values": {"en": {"content.blog.new_post": "Write an article"}, "de": {"content.blog.new_post": "Artikel schreiben"}}}'
      - name: undeclared_text
        given: ['core.elements.create#blog']
        as: admin
        path_params_json: '{"id": "${given.core.elements.create#blog.id}"}'
        body_json: '{"values": {"en": {"content.blog.by": "x"}}}'
        status: 400
      - name: without_manage
        given: ['core.elements.create#blog']
        as: other
        path_params_json: '{"id": "${given.core.elements.create#blog.id}"}'
        body_json: '{"values": {"en": {"content.blog.new_post": "x"}}}'
        status: 404
  - id: core.instances.rights.set
    category: CATEGORY_ACTION
    method: PUT
    path: /api/v1/elements/{id}/rights
    success_status: 200
    summary:
      text:
        en: Replace the permission rules of an instance (needs its manage permission; nobody grants more than they have)
        de: Rechte-Regeln einer Instanz ersetzen (braucht ihr Verwalten-Recht; niemand vergibt mehr, als er hat)
    signed_in: true
    safety: {changes: true}
    cli: {command: [instance, rights, set], args: [id]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['core.elements.create#blog', 'core.users.create#default']
        as: admin
        path_params_json: '{"id": "${given.core.elements.create#blog.id}"}'
        body_json: '{"rules": [{"subject_type": "user", "subject_id": ${given.core.users.create#default.id}, "actions": ["content.blog.edit"]}]}'
      - name: unknown_permission
        given: ['core.elements.create#blog']
        as: admin
        path_params_json: '{"id": "${given.core.elements.create#blog.id}"}'
        body_json: '{"rules": [{"subject_type": "authenticated", "actions": ["content.faq.edit"]}]}'
        status: 400
      - name: without_manage
        given: ['core.elements.create#blog']
        as: other
        path_params_json: '{"id": "${given.core.elements.create#blog.id}"}'
        body_json: '{"rules": []}'
        status: 404
  - id: core.elements.acl.get
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/elements/{id}/acl
    success_status: 200
    summary:
      text:
        en: Show the own rights of a page – rules, "own rights only", classification (needs the permission to give rights on it)
        de: Eigene Rechte einer Seite anzeigen – Regeln, „nur eigene Rechte“, Einstufung (braucht das Recht, Rechte darauf zu vergeben)
    permission: {key: core.category.manage, scope: SCOPE_CATEGORY, category_param: "element:id"}
    cli: {command: [element, acl, show], args: [id]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['core.elements.create#default']
        as: member
        path_params_json: '{"id": "${given.core.elements.create#default.id}"}'
        expect_json: '{"own_rights_only": false, "rules": []}'
      - name: with_rule
        given: ['core.elements.acl.add#default']
        path_params_json: '{"id": "${given.core.elements.create#default.id}"}'
        expect_json: '{"rules": [{"subject_type": "user", "permissions": 1}]}'
  - id: core.elements.acl.set
    category: CATEGORY_ACTION
    method: PUT
    path: /api/v1/elements/{id}/acl
    success_status: 200
    summary:
      text:
        en: Set "own rights only" and the classification of a page (the stricter classification of the page and its categories applies)
        de: „Nur eigene Rechte“ und die Einstufung einer Seite setzen (es gilt die strengere Einstufung von Seite und Kategorien)
    permission: {key: core.category.manage, scope: SCOPE_CATEGORY, category_param: "element:id"}
    safety: {changes: true}
    cli: {command: [element, acl, set], args: [id]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['core.elements.create#default']
        as: member
        path_params_json: '{"id": "${given.core.elements.create#default.id}"}'
        body_json: '{"own_rights_only": true, "classification": 2}'
        expect_json: '{"own_rights_only": true, "classification": 2, "effective_classification": 2}'
      - name: invalid_classification
        given: ['core.elements.create#default']
        path_params_json: '{"id": "${given.core.elements.create#default.id}"}'
        body_json: '{"classification": 7}'
        status: 400
  - id: core.elements.acl.add
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/elements/{id}/acl
    success_status: 201
    summary:
      text:
        en: Give permissions on one page (view, edit, delete, give rights; nobody gives more than they have)
        de: Rechte auf eine Seite vergeben (ansehen, bearbeiten, löschen, Rechte vergeben; niemand vergibt mehr, als er hat)
    permission: {key: core.category.manage, scope: SCOPE_CATEGORY, category_param: "element:id"}
    safety: {changes: true}
    cli: {command: [element, acl, add], args: [id]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['core.elements.create#default', 'core.users.create#default']
        as: member
        path_params_json: '{"id": "${given.core.elements.create#default.id}"}'
        body_json: '{"subject_type": "user", "subject_id": ${given.core.users.create#default.id}, "permissions": 1}'
        expect_json: '{"subject_type": "user", "permissions": 1}'
      - name: preset
        given: ['core.elements.create#default', 'core.users.create#default']
        path_params_json: '{"id": "${given.core.elements.create#default.id}"}'
        body_json: '{"subject_type": "user", "subject_id": ${given.core.users.create#default.id}, "preset": "editor"}'
        expect_json: '{"permissions": 11}'
      - name: category_bits
        given: ['core.elements.create#default']
        path_params_json: '{"id": "${given.core.elements.create#default.id}"}'
        body_json: '{"subject_type": "authenticated", "permissions": 16}'
        status: 400
      - name: guest_edit
        given: ['core.elements.create#default']
        path_params_json: '{"id": "${given.core.elements.create#default.id}"}'
        body_json: '{"subject_type": "guest", "permissions": 3}'
        status: 400
  - id: core.elements.acl.update
    category: CATEGORY_ACTION
    method: PUT
    path: /api/v1/element-acl/{id}
    success_status: 200
    summary:
      text:
        en: Change a permission rule of a page (needs the permission to give rights on the page)
        de: Rechte-Regel einer Seite ändern (braucht das Recht, Rechte auf die Seite zu vergeben)
    signed_in: true
    safety: {changes: true}
    cli: {command: [element, acl, update], args: [id]}
    ui: {entry: /e/:id}
    examples:
      - name: default

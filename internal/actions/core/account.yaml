    examples:
      - name: default
        as: self
  - id: core.me.mfa.setup.begin
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/me/mfa/{method}/begin
    summary:
      text:
        en: "Set up a sign-in factor, step 1"
        de: "Anmeldefaktor einrichten, Schritt 1"
    signed_in: true
    safety: {changes: true}
    ui: {entry: /profile}
    exceptions:
      - way: WAY_CLI
        reason: "Second factors are set up and removed only in the browser, within 15 minutes after signing in (passkeys need the browser anyway)."
        approved_by: "project owner, decision of 2026-11-11 (second factors are only changed in the browser)"
    examples:
      - name: default
        as: self
        path_params_json: '{"method": "totp"}'
        body_json: '{}'
      - name: totp
        as: self
        path_params_json: '{"method": "totp"}'
        body_json: '{}'
      - name: webauthn
        as: self
        path_params_json: '{"method": "webauthn"}'
        body_json: '{"passkey": false}'
  - id: core.me.mfa.setup.finish
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/me/mfa/{method}/finish
    summary:
      text:
        en: "Set up a sign-in factor, step 2"
        de: "Anmeldefaktor einrichten, Schritt 2"
    signed_in: true
    safety: {changes: true}
    ui: {entry: /profile}
    exceptions:
      - way: WAY_CLI
        reason: "Second factors are set up and removed only in the browser, within 15 minutes after signing in (passkeys need the browser anyway)."
        approved_by: "project owner, decision of 2026-11-11 (second factors are only changed in the browser)"
    examples:
      - name: default
        given: ['core.me.mfa.setup.begin#totp']
        as: self
        path_params_json: '{"method": "totp"}'
        body_json: '{"code": "${totp:${given.core.me.mfa.setup.begin#totp.secret}}"}'
        status: 204
      - name: wrong_code
        given: ['core.me.mfa.setup.begin#totp']
        as: self
        path_params_json: '{"method": "totp"}'
        body_json: '{"code": "000000"}'
        status: 401
      - name: webauthn
        given: ['core.me.mfa.setup.begin#webauthn']
        as: self
        path_params_json: '{"method": "webauthn"}'
        body_json: '{"name": "Laptop", "credential": ${webauthn.create:core.me.mfa.setup.begin#webauthn}}'
        status: 204

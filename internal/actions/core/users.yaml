# Action register (ewiki.plugin.v1.Action, see sdk/proto/ewiki/plugin/v1/action.proto).
actions:
  - id: core.users.list
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/admin/users
    summary:
      text:
        en: List and search accounts
        de: Konten auflisten und suchen
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    cli: {command: [user, list], builtin: true}
    ui: {entry: /admin/users}
  - id: core.users.create
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/admin/users
    summary:
      text:
        en: Create a local account
        de: Lokales Konto anlegen
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [user, create], builtin: true}
    ui: {entry: /admin/users}
  - id: core.users.get
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/admin/users/{id}
    summary:
      text:
        en: Show an account
        de: Konto anzeigen
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    cli: {command: [user, show], args: [id]}
    ui: {entry: /admin/users}
  - id: core.users.update
    category: CATEGORY_ACTION
    method: PUT
    path: /api/v1/admin/users/{id}
    summary:
      text:
        en: "Change an account (name, groups, roles, disabled, password)"
        de: "Konto ändern (Name, Gruppen, Rollen, gesperrt, Passwort)"
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [user, update], args: [id]}
    ui: {entry: /admin/users}
  - id: core.users.delete
    category: CATEGORY_ACTION
    method: DELETE
    path: /api/v1/admin/users/{id}
    summary:
      text:
        en: Delete an account
        de: Konto löschen
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [user, delete], args: [id]}
    ui: {entry: /admin/users}
  - id: core.users.invite
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/admin/users/invite
    summary:
      text:
        en: Invite a person (account before the first sign-in)
        de: Person einladen (Konto vor der ersten Anmeldung)
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [user, invite], builtin: true}
    ui: {entry: /admin/users}
  - id: core.users.alias
    category: CATEGORY_ACTION
    method: PUT
    path: /api/v1/admin/users/{id}/alias
    summary:
      text:
        en: Set the user name (alias) of an account
        de: Benutzernamen (Alias) eines Kontos festlegen
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [user, alias], builtin: true}
    ui: {entry: /admin/users}
  - id: core.users.emails.list
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/admin/users/{id}/emails
    summary:
      text:
        en: List the e-mail addresses of an account
        de: E-Mail-Adressen eines Kontos auflisten
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    cli: {command: [user, emails], builtin: true}
    ui: {entry: /admin/users}
  - id: core.users.emails.add
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/admin/users/{id}/emails
    summary:
      text:
        en: Add an e-mail address to an account
        de: E-Mail-Adresse zu einem Konto hinzufügen
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [user, email-add], builtin: true}
    ui: {entry: /admin/users}
  - id: core.users.emails.primary
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/admin/users/{id}/emails/{eid}/primary
    summary:
      text:
        en: Make an address the main address of an account
        de: Adresse zur Hauptadresse eines Kontos machen
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [user, email-primary], builtin: true}
    ui: {entry: /admin/users}
  - id: core.users.emails.remove
    category: CATEGORY_ACTION
    method: DELETE
    path: /api/v1/admin/users/{id}/emails/{eid}
    summary:
      text:
        en: Remove an e-mail address from an account
        de: E-Mail-Adresse von einem Konto entfernen
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [user, email-remove], builtin: true}
    ui: {entry: /admin/users}
  - id: core.users.identities.list
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/admin/users/{id}/identities
    summary:
      text:
        en: List the sign-ins linked to an account
        de: Mit einem Konto verknüpfte Anmeldungen auflisten
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    cli: {command: [user, identities], builtin: true}
    ui: {entry: /admin/users}
  - id: core.users.identities.unlink
    category: CATEGORY_ACTION
    method: DELETE
    path: /api/v1/admin/users/{id}/identities
    summary:
      text:
        en: Unlink a sign-in from an account
        de: Anmeldung von einem Konto lösen
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [user, unlink], builtin: true}
    ui: {entry: /admin/users}
  - id: core.users.profile.show
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/admin/users/{id}/profile
    summary:
      text:
        en: Show the profile of an account
        de: Profil eines Kontos anzeigen
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    cli: {command: [user, profile, show], args: [id]}
    ui: {entry: /admin/users}
  - id: core.users.profile.set
    category: CATEGORY_ACTION
    method: PUT
    path: /api/v1/admin/users/{id}/profile
    summary:
      text:
        en: Change the profile of an account
        de: Profil eines Kontos ändern
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [user, profile, set], args: [id]}
    ui: {entry: /admin/users}
  - id: core.users.sessions.list
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/admin/users/{id}/sessions
    summary:
      text:
        en: List the sessions of an account
        de: Sitzungen eines Kontos auflisten
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    cli: {command: [user, sessions], builtin: true}
    ui: {entry: /admin/users}
  - id: core.users.sessions.end_all
    category: CATEGORY_ACTION
    method: DELETE
    path: /api/v1/admin/users/{id}/sessions
    summary:
      text:
        en: Sign an account out everywhere
        de: Ein Konto überall abmelden
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [user, logout], builtin: true}
    ui: {entry: /admin/users}
  - id: core.users.sessions.end
    category: CATEGORY_ACTION
    method: DELETE
    path: /api/v1/admin/users/{id}/sessions/{sid}
    summary:
      text:
        en: End one session of an account
        de: Eine Sitzung eines Kontos beenden
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [user, logout], builtin: true}
    ui: {entry: /admin/users}
  - id: core.groups.create

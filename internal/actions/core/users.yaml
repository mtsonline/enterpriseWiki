    permission: {key: core.roles.manage, scope: SCOPE_GLOBAL}
    cli: {command: [perm, catalog]}
    ui: {entry: /admin/permissions}
  - id: core.permissions.defaults
    category: CATEGORY_ACTION
    method: PUT
    path: /api/v1/admin/permissions/authenticated
    summary:
      text:
        en: Set the global permissions of every signed-in person
        de: Globale Rechte jeder angemeldeten Person festlegen
    permission: {key: core.roles.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [perm, defaults, set], builtin: true}
    ui: {entry: /admin/permissions}
  - id: core.mfa.settings.show
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/admin/mfa
    summary:
      text:
        en: Show the factor chain and its settings
        de: Faktorkette und ihre Einstellungen anzeigen
    permission: {key: core.settings.manage, scope: SCOPE_GLOBAL}
    cli: {command: [mfa, settings, show]}
    ui: {entry: /admin/mfa}
  - id: core.mfa.settings.set
    category: CATEGORY_ACTION
    method: PUT
    path: /api/v1/admin/mfa
    summary:
      text:
        en: Change the factor chain and its settings
        de: Faktorkette und ihre Einstellungen ändern
    permission: {key: core.settings.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [mfa, settings, set]}
    ui: {entry: /admin/mfa}
  - id: core.api_keys.list
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/admin/api-keys
    summary:
      text:
        en: List the API keys of all accounts with their limits (administrators)
        de: API-Schlüssel aller Konten mit ihren Grenzen auflisten (Administratoren)
    permission: {key: core.admin, scope: SCOPE_GLOBAL}
    cli: {command: [api-keys, list]}
    ui: {entry: /admin/limits}
  - id: core.api_keys.rate
    category: CATEGORY_ACTION
    method: PUT
    path: /api/v1/admin/api-keys/{id}/rate

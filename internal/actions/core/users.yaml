  - id: core.scim.users.delete
    category: CATEGORY_PROTOCOL
    method: DELETE
    path: /scim/v2/Users/{id}
    summary:
      text:
        en: "Delete a user (accounts are disabled by default) (SCIM 2.0, for directories)"
        de: "Person löschen (Konten werden standardmäßig gesperrt) (SCIM 2.0, für Verzeichnisse)"

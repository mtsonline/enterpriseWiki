    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [scim, create], builtin: true}
    ui: {entry: /admin/scim}
  - id: core.scim.clients.token
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/admin/scim/clients/{id}/token
    summary:
      text:
        en: Create a new token for a SCIM client
        de: Neues Token für einen SCIM-Zugang erzeugen
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [scim, token], builtin: true}
    ui: {entry: /admin/scim}
  - id: core.scim.clients.delete
    category: CATEGORY_ACTION
    method: DELETE
    path: /api/v1/admin/scim/clients/{id}
    summary:
      text:
        en: Delete a SCIM client
        de: SCIM-Zugang löschen
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [scim, delete], builtin: true}
    ui: {entry: /admin/scim}

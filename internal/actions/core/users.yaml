# Action register (ewiki.plugin.v1.Action, see sdk/proto/ewiki/plugin/v1/action.proto).
actions:
  - id: core.users.list
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/admin/users
    success_status: 200
    summary:
      text:
        en: List and search accounts
        de: Konten auflisten und suchen
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    cli: {command: [user, list], builtin: true}
    ui: {entry: /admin/users}
    examples:
      - name: default
        given: ['core.users.create#default']
        as: member
        query_json: '{"q": "${given.core.users.create#default.username}"}'
  - id: core.users.create
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/admin/users
    success_status: 201
    summary:
      text:
        en: Create a local account
        de: Lokales Konto anlegen
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [user, create], builtin: true}
    ui: {entry: /admin/users}
    examples:
      - name: default
        as: member
        body_json: '{"username": "user${unique}", "password": "Example-Passw0rd!1", "display_name": "Example User", "email": "user${unique}@example.com"}'
        status: 201
  - id: core.users.get
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/admin/users/{id}
    success_status: 200
    summary:
      text:
        en: Show an account
        de: Konto anzeigen
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    cli: {command: [user, show], args: [id]}
    ui: {entry: /admin/users}
    examples:
      - name: default
        given: ['core.users.create#default']
        as: member
        path_params_json: '{"id": "${given.core.users.create#default.id}"}'
        expect_json: '{"username": "${given.core.users.create#default.username}"}'
  - id: core.users.update
    category: CATEGORY_ACTION
    method: PUT
    path: /api/v1/admin/users/{id}
    success_status: 200
    summary:
      text:
        en: "Change an account (name, groups, roles, disabled, password)"
        de: "Konto ändern (Name, Gruppen, Rollen, gesperrt, Passwort)"
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [user, update], args: [id]}
    ui: {entry: /admin/users}
    examples:
      - name: default
        given: ['core.users.create#default']
        as: member
        path_params_json: '{"id": "${given.core.users.create#default.id}"}'
        body_json: '{"display_name": "Renamed User"}'
        expect_json: '{"display_name": "Renamed User"}'
  - id: core.users.delete
    category: CATEGORY_ACTION
    method: DELETE
    path: /api/v1/admin/users/{id}
    success_status: 204
    summary:
      text:
        en: Delete an account
        de: Konto löschen
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [user, delete], args: [id]}
    ui: {entry: /admin/users}
    examples:
      - name: default
        given: ['core.users.create#default']
        as: member
        path_params_json: '{"id": "${given.core.users.create#default.id}"}'
        status: 204
  - id: core.users.invite
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/admin/users/invite
    success_status: 201
    summary:
      text:
        en: Invite a person (account before the first sign-in)
        de: Person einladen (Konto vor der ersten Anmeldung)
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [user, invite], builtin: true}
    ui: {entry: /admin/users}
    examples:
      - name: default
        as: member
        body_json: '{"email": "invited${unique}@example.com", "display_name": "Invited Person"}'
  - id: core.users.alias
    category: CATEGORY_ACTION
    method: PUT
    path: /api/v1/admin/users/{id}/alias
    success_status: 204
    summary:
      text:
        en: Set the user name (alias) of an account
        de: Benutzernamen (Alias) eines Kontos festlegen
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [user, alias], builtin: true}
    ui: {entry: /admin/users}
    examples:
      - name: default
        given: ['core.users.create#default']
        as: member
        path_params_json: '{"id": "${given.core.users.create#default.id}"}'
        body_json: '{"alias": "alias${unique}"}'
  - id: core.users.emails.list
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/admin/users/{id}/emails
    success_status: 200
    summary:
      text:
        en: List the e-mail addresses of an account
        de: E-Mail-Adressen eines Kontos auflisten
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    cli: {command: [user, emails], builtin: true}
    ui: {entry: /admin/users}
    examples:
      - name: default
        given: ['core.users.create#default']
        as: member
        path_params_json: '{"id": "${given.core.users.create#default.id}"}'
  - id: core.users.emails.add
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/admin/users/{id}/emails
    success_status: 201
    summary:
      text:
        en: Add an e-mail address to an account
        de: E-Mail-Adresse zu einem Konto hinzufügen
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [user, email-add], builtin: true}
    ui: {entry: /admin/users}
    examples:
      - name: default
        given: ['core.users.create#default']
        as: member
        path_params_json: '{"id": "${given.core.users.create#default.id}"}'
        body_json: '{"email": "extra${unique}@example.com", "verified": true}'
      - name: self_verified
        path_params_json: '{"id": "${self.id}"}'
        body_json: '{"email": "self${unique}@example.com", "verified": true}'
  - id: core.users.emails.primary
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/admin/users/{id}/emails/{eid}/primary
    success_status: 204
    summary:
      text:
        en: Make an address the main address of an account
        de: Adresse zur Hauptadresse eines Kontos machen
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [user, email-primary], builtin: true}
    ui: {entry: /admin/users}
    examples:
      - name: default
        given: ['core.users.create#default', 'core.users.emails.add#default']
        as: member
        path_params_json: '{"id": "${given.core.users.create#default.id}", "eid": "${given.core.users.emails.add#default.id}"}'
  - id: core.users.emails.remove
    category: CATEGORY_ACTION
    method: DELETE
    path: /api/v1/admin/users/{id}/emails/{eid}
    success_status: 204
    summary:
      text:
        en: Remove an e-mail address from an account
        de: E-Mail-Adresse von einem Konto entfernen
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [user, email-remove], builtin: true}
    ui: {entry: /admin/users}
    examples:
      - name: default
        given: ['core.users.create#default', 'core.users.emails.add#default']
        as: member
        path_params_json: '{"id": "${given.core.users.create#default.id}", "eid": "${given.core.users.emails.add#default.id}"}'
        status: 204
  - id: core.users.identities.list
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/admin/users/{id}/identities
    success_status: 200
    summary:
      text:
        en: List the sign-ins linked to an account
        de: Mit einem Konto verknüpfte Anmeldungen auflisten
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    cli: {command: [user, identities], builtin: true}
    ui: {entry: /admin/users}
    examples:
      - name: default
        given: ['core.users.create#default']
        as: member
        path_params_json: '{"id": "${given.core.users.create#default.id}"}'
  - id: core.users.identities.unlink
    category: CATEGORY_ACTION
    method: DELETE
    path: /api/v1/admin/users/{id}/identities
    success_status: 204
    summary:
      text:
        en: Unlink a sign-in from an account
        de: Anmeldung von einem Konto lösen
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [user, unlink], builtin: true}
    ui: {entry: /admin/users}
    examples:
      # the whole way (sign in with a provider, link, unlink) is in
      # TestIdentityLinking: a confirmed address belongs to one account only,
      # so it cannot run again for the second way
      - name: not_linked
        as: member
        given: [core.users.create#default]
        path_params_json: '{"id": ${given.core.users.create#default.id}}'
        query_json: '{"provider": "ldap", "subject": "nobody"}'
        status: 404
  - id: core.users.profile.show
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/admin/users/{id}/profile
    success_status: 200
    summary:
      text:
        en: Show the profile of an account
        de: Profil eines Kontos anzeigen
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    cli: {command: [user, profile, show], args: [id]}
    ui: {entry: /admin/users}
    examples:
      - name: default
        given: ['core.users.create#default']
        as: member
        path_params_json: '{"id": "${given.core.users.create#default.id}"}'
  - id: core.users.profile.set
    category: CATEGORY_ACTION
    method: PUT
    path: /api/v1/admin/users/{id}/profile
    success_status: 200
    summary:
      text:
        en: Change the profile of an account
        de: Profil eines Kontos ändern
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [user, profile, set], args: [id]}
    ui: {entry: /admin/users}
    examples:
      - name: default
        given: ['core.users.create#default']
        as: member
        path_params_json: '{"id": "${given.core.users.create#default.id}"}'
        body_json: '{"phone": "+43 1 234 567"}'
  - id: core.users.sessions.list
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/admin/users/{id}/sessions
    success_status: 200
    summary:
      text:
        en: List the sessions of an account
        de: Sitzungen eines Kontos auflisten
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    cli: {command: [user, sessions], builtin: true}
    ui: {entry: /admin/users}
    examples:
      - name: default
        as: member
        path_params_json: '{"id": "${other.id}"}'
      - name: other
        path_params_json: '{"id": "${other.id}"}'
  - id: core.users.sessions.end_all
    category: CATEGORY_ACTION
    method: DELETE
    path: /api/v1/admin/users/{id}/sessions
    success_status: 204
    summary:
      text:
        en: Sign an account out everywhere
        de: Ein Konto überall abmelden
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [user, logout], builtin: true}
    ui: {entry: /admin/users}
    examples:
      - name: default
        as: member
        path_params_json: '{"id": "${other.id}"}'
        status: 204
  - id: core.users.sessions.end
    category: CATEGORY_ACTION
    method: DELETE
    path: /api/v1/admin/users/{id}/sessions/{sid}
    success_status: 204
    summary:
      text:
        en: End one session of an account
        de: Eine Sitzung eines Kontos beenden
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [user, logout], builtin: true}
    ui: {entry: /admin/users}
    examples:
      - name: default
        given: ['core.users.sessions.list#other']
        as: member
        path_params_json: '{"id": "${other.id}", "sid": "${given.core.users.sessions.list#other.0.id}"}'
        status: 204
  - id: core.groups.create
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/admin/groups
    success_status: 201
    summary:
      text:
        en: Create a group
        de: Gruppe anlegen
    permission: {key: core.groups.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [group, create]}
    ui: {entry: /admin/groups}
    examples:
      - name: default
        as: member
        body_json: '{"name": "Group ${unique}", "description": "Example group"}'
  - id: core.groups.update
    category: CATEGORY_ACTION
    method: PUT
    path: /api/v1/admin/groups/{id}
    success_status: 200
    summary:
      text:
        en: "Change a group (name, roles)"
        de: "Gruppe ändern (Name, Rollen)"
    permission: {key: core.groups.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [group, update], args: [id]}
    ui: {entry: /admin/groups}
    examples:
      - name: default
        given: ['core.groups.create#default']
        as: member
        path_params_json: '{"id": "${given.core.groups.create#default.id}"}'
        body_json: '{"name": "Renamed ${unique}", "description": "Changed"}'
  - id: core.groups.delete
    category: CATEGORY_ACTION
    method: DELETE
    path: /api/v1/admin/groups/{id}
    success_status: 204
    summary:
      text:
        en: Delete a group
        de: Gruppe löschen
    permission: {key: core.groups.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [group, delete], args: [id]}
    ui: {entry: /admin/groups}
    examples:
      - name: default
        given: ['core.groups.create#default']
        as: member
        path_params_json: '{"id": "${given.core.groups.create#default.id}"}'
        status: 204
  - id: core.groups.members.list
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/admin/groups/{id}/members
    success_status: 200
    summary:
      text:
        en: List the members of a group
        de: Mitglieder einer Gruppe auflisten
    permission: {key: core.groups.manage, scope: SCOPE_GLOBAL}
    cli: {command: [group, members, list], args: [id]}
    ui: {entry: /admin/groups}
    examples:
      - name: default
        given: ['core.groups.create#default']
        as: member
        path_params_json: '{"id": "${given.core.groups.create#default.id}"}'
  - id: core.groups.members.add
    category: CATEGORY_ACTION
    method: PUT
    path: /api/v1/admin/groups/{id}/members/{user}
    success_status: 204
    summary:
      text:
        en: Add a person to a group
        de: Person zu einer Gruppe hinzufügen
    permission: {key: core.groups.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [group, members, add], args: [id, user]}
    ui: {entry: /admin/groups}
    examples:
      - name: default
        given: ['core.groups.create#default', 'core.users.create#default']
        as: member
        path_params_json: '{"id": "${given.core.groups.create#default.id}", "user": "${given.core.users.create#default.id}"}'
  - id: core.groups.members.remove
    category: CATEGORY_ACTION
    method: DELETE
    path: /api/v1/admin/groups/{id}/members/{user}
    success_status: 204
    summary:
      text:
        en: Remove a person from a group
        de: Person aus einer Gruppe entfernen
    permission: {key: core.groups.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [group, members, remove], args: [id, user]}
    ui: {entry: /admin/groups}
    examples:
      - name: default
        given: ['core.groups.create#default', 'core.users.create#default', 'core.groups.members.add#default']
        as: member
        path_params_json: '{"id": "${given.core.groups.create#default.id}", "user": "${given.core.users.create#default.id}"}'
  - id: core.roles.create
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/admin/roles
    success_status: 201
    summary:
      text:
        en: Create a role with permissions
        de: Rolle mit Rechten anlegen
    permission: {key: core.roles.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [role, create]}
    ui: {entry: /admin/roles}
    examples:
      - name: default
        as: member
        body_json: '{"name": "Role ${unique}", "description": "Example role", "permissions": []}'
      - name: escalation
        as: member
        body_json: '{"name": "Role ${unique}", "permissions": ["core.users.manage"]}'
        status: 403
  - id: core.roles.update
    category: CATEGORY_ACTION
    method: PUT
    path: /api/v1/admin/roles/{id}
    success_status: 200
    summary:
      text:
        en: Change a role
        de: Rolle ändern
    permission: {key: core.roles.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [role, update], args: [id]}
    ui: {entry: /admin/roles}
    examples:
      - name: default
        given: ['core.roles.create#default']
        as: member
        path_params_json: '{"id": "${given.core.roles.create#default.id}"}'
        body_json: '{"name": "Renamed ${unique}", "permissions": []}'
  - id: core.roles.delete
    category: CATEGORY_ACTION
    method: DELETE
    path: /api/v1/admin/roles/{id}
    success_status: 204
    summary:
      text:
        en: Delete a role
        de: Rolle löschen
    permission: {key: core.roles.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [role, delete], args: [id]}
    ui: {entry: /admin/roles}
    examples:
      - name: default
        given: ['core.roles.create#default']
        as: member
        path_params_json: '{"id": "${given.core.roles.create#default.id}"}'
        status: 204
  - id: core.permissions.global
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/admin/permissions
    success_status: 200
    summary:
      text:
        en: List all permissions and the defaults of every signed-in person
        de: Alle Rechte und die Vorgaben für jede angemeldete Person auflisten
    permission: {key: core.roles.manage, scope: SCOPE_GLOBAL}
    cli: {command: [perm, catalog]}
    ui: {entry: /admin/permissions}
    examples:
      - name: default
        as: member
  - id: core.permissions.defaults
    category: CATEGORY_ACTION
    method: PUT
    path: /api/v1/admin/permissions/authenticated
    success_status: 204
    summary:
      text:
        en: Set the global permissions of every signed-in person
        de: Globale Rechte jeder angemeldeten Person festlegen
    permission: {key: core.roles.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [perm, defaults, set], builtin: true}
    ui: {entry: /admin/permissions}
    examples:
      - name: default
        given: ['core.permissions.global#default']  # writes back the current defaults (no change for the other examples)
        as: member
        body_json: '{"permissions": ${given.core.permissions.global#default.authenticated}}'
  - id: core.mfa.settings.show
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/admin/mfa
    success_status: 200
    summary:
      text:
        en: Show the factor chain and its settings
        de: Faktorkette und ihre Einstellungen anzeigen
    permission: {key: core.settings.manage, scope: SCOPE_GLOBAL}
    cli: {command: [mfa, settings, show]}
    ui: {entry: /admin/mfa}
    examples:
      - name: default
        as: member
  - id: core.mfa.settings.set
    category: CATEGORY_ACTION
    method: PUT
    path: /api/v1/admin/mfa
    success_status: 200
    summary:
      text:
        en: Change the factor chain and its settings
        de: Faktorkette und ihre Einstellungen ändern
    permission: {key: core.settings.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [mfa, settings, set]}
    ui: {entry: /admin/mfa}
    examples:
      - name: default
        as: member
        body_json: '{}'
  - id: core.api_keys.list
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/admin/api-keys
    success_status: 200
    summary:
      text:
        en: List the API keys of all accounts with their limits (administrators)
        de: API-Schlüssel aller Konten mit ihren Grenzen auflisten (Administratoren)
    permission: {key: core.admin, scope: SCOPE_GLOBAL}
    cli: {command: [api-keys, list]}
    ui: {entry: /admin/limits}
    examples:
      - name: default
  - id: core.api_keys.rate
    category: CATEGORY_ACTION
    method: PUT
    path: /api/v1/admin/api-keys/{id}/rate
    success_status: 204
    summary:
      text:
        en: Give an API key its own request budget (administrators)
        de: Einem API-Schlüssel ein eigenes Anfrage-Kontingent geben (Administratoren)
    permission: {key: core.admin, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [api-keys, rate], args: [id]}
    ui: {entry: /admin/limits}
    examples:
      - name: default
        given: ['core.me.api_keys.create#admin']
        path_params_json: '{"id": "${given.core.me.api_keys.create#admin.id}"}'
        body_json: '{"rate_per_second": 20}'
        status: 204
  - id: core.scim.clients.list
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/admin/scim/clients
    success_status: 200
    summary:
      text:
        en: List the SCIM clients
        de: SCIM-Zugänge auflisten
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    cli: {command: [scim, list], builtin: true}
    ui: {entry: /admin/scim}
    examples:
      - name: default
        as: member
  - id: core.scim.clients.create
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/admin/scim/clients
    success_status: 201
    summary:
      text:
        en: Create a SCIM client (the token is shown once)
        de: SCIM-Zugang anlegen (das Token wird einmal gezeigt)
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [scim, create], builtin: true}
    ui: {entry: /admin/scim}
    examples:
      - name: ldap
        as: member
        requires: [ldap]
        given: [core.settings.update#ldap]
        body_json: '{"name": "Directory ${unique}", "provider": "ldap", "subject_from": "externalId", "on_delete": "disable"}'
        expect_json: '{"client": {"provider": "ldap", "subject_from": "externalId"}}'
      - name: unknown_provider
        as: member
        body_json: '{"name": "Directory ${unique}", "provider": "nowhere"}'
        status: 400
  - id: core.scim.clients.token
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/admin/scim/clients/{id}/token
    success_status: 200
    summary:
      text:
        en: Create a new token for a SCIM client
        de: Neues Token für einen SCIM-Zugang erzeugen
    permission: {key: core.users.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}

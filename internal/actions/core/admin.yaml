      text:
        en: List the outgoing messages
        de: Ausgehende Nachrichten auflisten
    permission: {key: core.mail.manage, scope: SCOPE_GLOBAL}
    cli: {command: [mail, list], builtin: true}
    ui: {entry: /admin/mail}
  - id: core.mail.get
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/admin/mail/outbox/{id}
    summary:
      text:
        en: Show a message with the delivery state of every recipient
        de: Nachricht mit dem Zustellstatus jedes Empfängers anzeigen
    permission: {key: core.mail.manage, scope: SCOPE_GLOBAL}
    cli: {command: [mail, show], builtin: true}
    ui: {entry: /admin/mail}

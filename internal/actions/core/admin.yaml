      text:
        en: "Show transport, queue and the oldest undelivered message"
        de: "Versand, Warteschlange und älteste nicht zugestellte Nachricht anzeigen"
    permission: {key: core.mail.manage, scope: SCOPE_GLOBAL}
    cli: {command: [mail, status], builtin: true}
    ui: {entry: /admin/mail}
  - id: core.mail.list

# Action register (ewiki.plugin.v1.Action, see sdk/proto/ewiki/plugin/v1/action.proto).
actions:
  - id: core.settings.get
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/admin/settings
    summary:
      text:
        en: Show the settings of the wiki
        de: Einstellungen des Wikis anzeigen
    permission: {key: core.settings.manage, scope: SCOPE_GLOBAL}
    cli: {command: [settings, show]}
    ui: {entry: /admin/settings}
  - id: core.settings.update
    category: CATEGORY_ACTION
    method: PUT
    path: /api/v1/admin/settings
    summary:
      text:
        en: Change the settings of the wiki
        de: Einstellungen des Wikis ändern
    permission: {key: core.settings.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [settings, update]}
    ui: {entry: /admin/settings}
  - id: core.retention.run
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/admin/retention/run
    summary:
      text:
        en: "Apply the retention rules now (versions, trash, audit log)"
        de: "Aufbewahrungsregeln jetzt anwenden (Versionen, Papierkorb, Protokoll)"
    permission: {key: core.settings.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [retention, run], builtin: true}
    ui: {entry: /admin/settings}
  - id: core.database.status
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/admin/database
    summary:
      text:
        en: Show the database version and whether an upgrade is due
        de: Datenbank-Version anzeigen und ob ein Upgrade fällig ist
    permission: {key: core.system.manage, scope: SCOPE_GLOBAL}
    cli: {command: [database, status]}
    ui: {entry: /admin/settings}
  - id: core.limits.get
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/admin/limits
    summary:
      text:
        en: Show the limits (expert settings)
        de: Grenzwerte anzeigen (Experteneinstellungen)
    permission: {key: core.settings.manage, scope: SCOPE_GLOBAL}
    cli: {command: [limits, show]}
    ui: {entry: /admin/limits}
  - id: core.limits.update
    category: CATEGORY_ACTION
    method: PUT
    path: /api/v1/admin/limits
    summary:
      text:
        en: Change the limits (expert settings)
        de: Grenzwerte ändern (Experteneinstellungen)
    permission: {key: core.settings.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [limits, update]}
    ui: {entry: /admin/limits}
  - id: core.secrets.status
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/admin/secrets
    summary:
      text:
        en: Show how secrets are stored (on other sites than the main site only for instance administrators)
        de: "Anzeigen, wie Geheimnisse gespeichert werden (auf anderen Sites als der Haupt-Site nur für Instanz-Administratoren)"
    permission: {key: core.admin, scope: SCOPE_GLOBAL}
    cli: {command: [secrets, status]}
    ui: {entry: /admin/limits}
  - id: core.secrets.rewrap
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/admin/secrets/rewrap
    summary:
      text:
        en: Store all secrets again in the chosen mode
        de: Alle Geheimnisse erneut in der gewählten Art speichern
    permission: {key: core.admin, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [secrets, rewrap]}
    ui: {entry: /admin/limits}
  - id: core.cache.status
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/admin/cache
    summary:
      text:
        en: Show the state of the caches
        de: Zustand der Zwischenspeicher anzeigen
    permission: {key: core.system.manage, scope: SCOPE_GLOBAL}
    cli: {command: [cache, status], builtin: true}
    ui: {entry: /admin/cache}
  - id: core.cache.clear
    category: CATEGORY_ACTION
    method: DELETE
    path: /api/v1/admin/cache
    summary:
      text:
        en: Clear the caches
        de: Zwischenspeicher leeren
    permission: {key: core.system.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [cache, clear], builtin: true}
    ui: {entry: /admin/cache}
  - id: core.mail.status
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/admin/mail

        de: Nachricht aus der Warteschlange löschen
    permission: {key: core.mail.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [mail, delete], builtin: true}
    ui: {entry: /admin/mail}
  - id: core.mail.test
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/admin/mail/test
    summary:
      text:
        en: Send a test message now
        de: Testnachricht jetzt senden
    permission: {key: core.mail.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [mail, test], builtin: true}
    ui: {entry: /admin/mail}
  - id: core.jobs.list
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/admin/jobs
    summary:
      text:
        en: List the background jobs
        de: Hintergrundaufgaben auflisten
    permission: {key: core.plugins.manage, scope: SCOPE_GLOBAL}
    cli: {command: [jobs, list], builtin: true}
    ui: {entry: /admin/mail}
  - id: core.jobs.run
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/admin/jobs/{name}/run
    summary:
      text:
        en: Run a background job now
        de: Hintergrundaufgabe jetzt ausführen
    permission: {key: core.plugins.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [jobs, run], builtin: true}
    ui: {entry: /admin/mail}
  - id: core.webhooks.list

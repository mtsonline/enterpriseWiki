# Action register (ewiki.plugin.v1.Action, see sdk/proto/ewiki/plugin/v1/action.proto).
actions:
  - id: core.site
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/site
    success_status: 200
    summary:
      text:
        en: "Public information about the wiki (name, languages, active plugins)"
        de: "Öffentliche Angaben zum Wiki (Name, Sprachen, aktive Plugins)"
    public: true
    cli: {command: [wiki, info]}
    ui: {entry: /}
    examples:
      - name: default
        as: guest
  - id: core.placements.resolve
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/placements
    success_status: 200
    summary:
      text:
        en: Where the building blocks of the interface appear on a page (levels template, site, category, page, own)
        de: Wo die Bausteine der Oberfläche auf einer Seite erscheinen (Ebenen Vorlage, Website, Kategorie, Seite, eigene)
    public: true
    cli: {command: [placement, resolve]}
    ui: {entry: /}
    examples:
      - name: default
        given: ['core.placements.set#site']
        as: guest
        expect_json: '[{"level": "site", "target": ""}]'
      - name: category
        given: ['core.placements.set#category']
        as: admin
        query_json: '{"category": "${given.core.categories.create#default.id}"}'
      - name: element
        given: ['core.placements.set#instance']
        as: admin
        query_json: '{"element": "${given.core.elements.create#default.id}"}'
        expect_json: '[{"level": "instance"}]'
  - id: core.placements.get
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/placements/{level}
    success_status: 200
    summary:
      text:
        en: Show the placements of one level (template and site need the settings permission, a category its manage permission, a page (instance) the permission to edit it or, for a blog, a FAQ …, to manage it; the own level personal placement)
        de: Platzierungen einer Ebene anzeigen (Vorlage und Website brauchen das Einstellungs-Recht, eine Kategorie ihr Verwalten-Recht, eine Seite (instance) das Recht, sie zu bearbeiten, bei einem Blog, einer FAQ … sie zu verwalten; die eigene Ebene persönliche Platzierung)
    signed_in: true
    cli: {command: [placement, show], args: [level]}
    ui: {entry: /admin/placement}
    examples:
      - name: default
        given: ['core.placements.set#site']
        as: admin
        path_params_json: '{"level": "site"}'
        expect_json: '{"level": "site", "placements": [{"block": "core.search", "position": "footer"}]}'
      - name: category_without_manage
        given: ['core.categories.create#default']
        as: other
        path_params_json: '{"level": "category"}'
        query_json: '{"target": "${given.core.categories.create#default.id}"}'
        status: 404
  - id: core.placements.set
    category: CATEGORY_ACTION
    method: PUT
    path: /api/v1/placements/{level}
    success_status: 200
    summary:
      text:
        en: "Replace the placements of one level (who may: see core.placements.get)"
        de: "Platzierungen einer Ebene ersetzen (wer darf: siehe core.placements.get)"
    signed_in: true
    safety: {changes: true}
    cli: {command: [placement, set], args: [level]}
    ui: {entry: /admin/placement}
    examples:
      - name: site
        as: admin
        path_params_json: '{"level": "site"}'
        body_json: '{"placements": [{"block": "core.search", "position": "footer", "sort": 10}, {"block": "core.user", "position": "header-tools", "sort": 40, "required": true}]}'
      - name: category
        given: ['core.categories.create#default']
        as: admin
        path_params_json: '{"level": "category"}'
        query_json: '{"target": "${given.core.categories.create#default.id}"}'
        body_json: '{"placements": [{"block": "core.tree", "position": ""}]}'
      - name: instance
        given: ['core.elements.create#default']
        as: admin
        path_params_json: '{"level": "instance"}'
        query_json: '{"target": "${given.core.elements.create#default.id}"}'
        body_json: '{"placements": [{"block": "core.element.title", "position": ""}, {"block": "core.element.watch", "position": "element-footer", "sort": 5}]}'
      - name: instance_site_position
        given: ['core.elements.create#default']
        as: admin
        path_params_json: '{"level": "instance"}'
        query_json: '{"target": "${given.core.elements.create#default.id}"}'
        body_json: '{"placements": [{"block": "core.search", "position": "sidebar"}]}'
        status: 400
      - name: unknown_block
        as: admin
        path_params_json: '{"level": "site"}'
        body_json: '{"placements": [{"block": "nobody.thing", "position": "footer"}]}'
        status: 400
      - name: own_switched_off
        as: self
        path_params_json: '{"level": "user"}'
        query_json: '{"target": "${self.id}"}'
        body_json: '{"placements": []}'
        status: 403
  - id: core.ready
    category: CATEGORY_PROTOCOL
    method: GET
    path: /readyz
    summary:
      text:
        en: Readiness check for load balancers (database reachable)
        de: Bereitschaftsprüfung für Lastverteiler (Datenbank erreichbar)
  - id: core.resolve
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/resolve
    success_status: 200
    summary:
      text:
        en: Find the element or category of a readable address
        de: Element oder Kategorie zu einer lesbaren Adresse finden
    public: true
    cli: {command: [resolve]}
    ui: {entry: /}
    examples:
      - name: default
        given: ['core.categories.create#default', 'core.categories.update#short']
        query_json: '{"path": "/${given.core.categories.update#short.short_url}"}'
  - id: core.not_found
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/not-found
    success_status: 200
    summary:
      text:
        en: "Explain a missing address (deleted page, suggestions)"
        de: "Fehlende Adresse erklären (gelöschte Seite, Vorschläge)"
    public: true
    cli: {command: [not-found]}
    ui: {entry: /}
    examples:
      - name: default
        as: guest
        query_json: '{"path": "/no/such/page"}'
  - id: core.elements.types
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/element-types
    success_status: 200
    summary:
      text:
        en: List the types of elements
        de: Arten von Elementen auflisten
    public: true
    cli: {command: [element, types]}
    ui: {entry: /c/:id/new}
    examples:
      - name: default
        as: guest
  - id: core.macros
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/macros
    success_status: 200
    summary:
      text:
        en: List the macros of the active plugins
        de: Makros der aktiven Plugins auflisten
    public: true
    cli: {command: [macro, list]}
    ui: {entry: /e/:id/edit}
    examples:
      - name: default
        as: guest
  - id: core.sources.preview
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/sources/preview
    success_status: 200
    summary:
      text:
        en: Preview the content a source selects (with your rights)
        de: "Vorschau der Inhalte, die eine Quelle auswählt (mit Ihren Rechten)"
    signed_in: true
    safety: {changes: true}
    cli: {command: [source, preview]}
    ui: {entry: /e/:id/edit}
    examples:
      - name: default
        given: ['core.categories.create#default', 'core.elements.create#default']
        body_json: '{"sources": "category:${given.core.categories.create#default.id}", "lang": "en"}'
  - id: core.groups.names
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/groups
    success_status: 200
    summary:
      text:
        en: "List the groups: all or the own ones (core.groups.list_all or core.groups.list_own)"
        de: "Gruppen auflisten: alle oder die eigenen (core.groups.list_all oder core.groups.list_own)"
    signed_in: true
    cli: {command: [perm, groups]}
    ui: {entry: /c/:id/settings}
    examples:
      - name: default
        as: self
  - id: core.roles.names
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/roles
    success_status: 200
    summary:
      text:
        en: "List the roles: all or the own ones (core.roles.list_all or core.roles.list_own)"
        de: "Rollen auflisten: alle oder die eigenen (core.roles.list_all oder core.roles.list_own)"
    signed_in: true
    cli: {command: [perm, roles]}
    ui: {entry: /c/:id/settings}
    examples:
      - name: default
        as: self
  - id: core.users.lookup
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/users/lookup
    success_status: 200
    summary:
      text:
        en: "Find users by name: all or those of the own groups (core.users.list_all or core.users.list_own)"
        de: "Benutzer nach Namen finden: alle oder die der eigenen Gruppen (core.users.list_all oder core.users.list_own)"
    signed_in: true
    cli: {command: [perm, users]}
    ui: {entry: /c/:id/settings}
    examples:
      - name: default
        as: self
        query_json: '{"q": "${self.name}"}'
      # the full handle as the list shows it (regression: found nobody)
      - name: handle
        as: self
        query_json: '{"q": "${self.name}@local"}'
        expect_json: '[{"handle": "${self.name}@local"}]'
  - id: core.permissions.list
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/permissions
    success_status: 200
    summary:
      text:
        en: List all permissions of the core and the plugins
        de: Alle Rechte des Kerns und der Plugins auflisten
    signed_in: true
    cli: {command: [perm, list], builtin: true}
    ui: {entry: /c/:id/settings}
    examples:
      - name: default
        as: self
  - id: core.permissions.overview
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/permissions/overview
    success_status: 200
    summary:
      text:
        en: "Show the permissions of a user, group or role in the categories you manage"
        de: "Rechte eines Benutzers, einer Gruppe oder Rolle in den Kategorien zeigen, die Sie verwalten"
    signed_in: true
    cli: {command: [perm, overview], builtin: true}
    ui: {entry: /admin/permissions}
    examples:
      - name: default
        given: ['core.categories.create#default']
        query_json: '{"subject_type": "user", "subject_id": "${other.id}"}'
  - id: core.access.request
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/access-requests
    success_status: 202
    summary:
      text:
        en: Ask for access to a category or an element (a page with own rights only is asked for itself)
        de: Zugriff auf eine Kategorie oder ein Element anfragen (eine Seite mit nur eigenen Rechten wird selbst angefragt)
    signed_in: true
    safety: {changes: true}
    cli: {command: [access, request]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['core.categories.create#default']
        as: self
        body_json: '{"type": "category", "id": ${given.core.categories.create#default.id}, "message": "I work on this project."}'
        expect_json: '{"sent": true}'
      - name: other
        given: ['core.categories.create#default']
        as: other
        body_json: '{"type": "category", "id": ${given.core.categories.create#default.id}, "message": "Please let me in."}'
        expect_json: '{"sent": true}'
      - name: own_rights_page
        given: ['core.elements.acl.set#default']
        as: other
        body_json: '{"type": "element", "id": ${given.core.elements.create#default.id}, "message": "Please let me read it."}'
        expect_json: '{"sent": true}'
  - id: core.access.answer
    category: CATEGORY_ACTION
    method: POST
    path: /api/v1/access-requests/{id}
    success_status: 204
    summary:
      text:
        en: Grant or refuse an access request (needs manage on the category)
        de: Zugriffsanfrage gewähren oder ablehnen (braucht Verwalten der Kategorie)
    signed_in: true
    safety: {changes: true}
    cli: {command: [access, answer], args: [id]}
    ui: {entry: /c/:id/settings}
    examples:
      - name: default
        given: ['core.categories.create#default', 'core.access.request#other', 'core.categories.access_requests#open']
        path_params_json: '{"id": "${given.core.categories.access_requests#open.0.id}"}'
        body_json: '{"grant": true, "preset": "reader"}'
        status: 204
  - id: core.signatures.methods
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/signature-methods
    success_status: 200
    summary:
      text:
        en: List the methods to sign
        de: Verfahren zum Signieren auflisten
    signed_in: true
    cli: {command: [signature, methods]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        as: self
  - id: core.signatures.keys
    category: CATEGORY_ACTION
    method: GET
    path: /api/v1/signature-keys
    success_status: 200
    summary:
      text:
        en: List the public seal keys of the wiki
        de: Öffentliche Siegel-Schlüssel des Wikis auflisten
    signed_in: true
    cli: {command: [signature, keys], builtin: true}
    ui: {entry: /signatures/verify}
    examples:
      - name: default
        as: self
  - id: core.collab
    category: CATEGORY_PROTOCOL
    method: GET
    path: /api/v1/collab/elements/{id}/{lang}
    summary:
      text:
        en: Live editing of a page together (WebSocket; needs edit on the element)
        de: Gemeinsames Bearbeiten einer Seite in Echtzeit (WebSocket; braucht Bearbeiten des Elements)
  - id: core.wopi.check_file_info
    category: CATEGORY_PROTOCOL
    method: GET
    path: /api/v1/wopi/files/{id}
    summary:
      text:
        en: "WOPI: information about a file (for office servers, with access token)"
        de: "WOPI: Angaben zu einer Datei (für Office-Server, mit Zugriffstoken)"
  - id: core.wopi.file_operation
    category: CATEGORY_PROTOCOL
    method: POST
    path: /api/v1/wopi/files/{id}
    summary:
      text:
        en: "WOPI: lock, unlock and other file operations (for office servers)"
        de: "WOPI: Sperren, Entsperren und weitere Dateivorgänge (für Office-Server)"
    safety: {changes: true}
  - id: core.wopi.get_file
    category: CATEGORY_PROTOCOL
    method: GET
    path: /api/v1/wopi/files/{id}/contents
    summary:
      text:
        en: "WOPI: content of a file (for office servers)"
        de: "WOPI: Inhalt einer Datei (für Office-Server)"
  - id: core.wopi.put_file
    category: CATEGORY_PROTOCOL
    method: POST
    path: /api/v1/wopi/files/{id}/contents
    summary:
      text:
        en: "WOPI: store a new content of a file (for office servers)"
        de: "WOPI: Neuen Inhalt einer Datei speichern (für Office-Server)"
    safety: {changes: true}
  - id: core.health
    category: CATEGORY_PROTOCOL
    method: GET
    path: /healthz
    summary:
      text:
        en: Liveness check (the process answers)
        de: Lebenszeichen (der Prozess antwortet)
  - id: core.tls_allowed
    category: CATEGORY_PROTOCOL
    method: GET
    path: /tls-allowed
    summary:
      text:
        en: Asks whether a TLS certificate may be requested for a host (bundled reverse proxy)
        de: "Fragt, ob für einen Hostnamen ein TLS-Zertifikat angefordert werden darf (mitgelieferter Reverse Proxy)"

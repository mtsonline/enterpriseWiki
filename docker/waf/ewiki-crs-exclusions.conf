# Enterprise Wiki behind a web application firewall with the OWASP Core
# Rule Set (CRS 3.3 and 4; ModSecurity 2 and 3, Coraza).
#
# Why: pages, drafts, templates, comments and forms carry text that looks
# like attacks to the CRS - a line starting with "Sort the list" or "set the
# value" (shell commands), code samples with <script> or onclick=, SQL in an
# IT manual. The CRS then blocks saving with 403. The wiki checks and cleans
# these inputs itself (HTML sanitizer, no event attributes, strict
# Content-Security-Policy, parameterised SQL, no shell).
#
# What: for JSON request bodies of the API (POST, PUT, PATCH, DELETE under
# /api/v1/) the attack rules no longer look at the values (ARGS and the raw
# body); and the search term (q) of the search may contain code. Everything
# else stays checked: path and query string of all other requests, headers,
# cookies, names of JSON fields, uploads (multipart), protocol rules,
# scanners, request limits.
#
# How: include this file BEFORE the CRS rules, for example as
#   /etc/modsecurity/crs/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
# (Debian/Ubuntu) or with "Include" in the virtual host of the wiki before
# the include of the CRS. The rule IDs 75100-75102 are in the range for
# local rules; change them if they are taken.
#
# Also: the API uses PUT, PATCH and DELETE (saving an existing page,
# changing settings, deleting). The CRS allows only GET, HEAD, POST and
# OPTIONS by default (rule 911100, tx.allowed_methods); rule 75102 allows
# the other three for /api/v1/ only.
#
# Tested by internal/server/waf_test.go (TestWAFExclusions) with CRS 3.3.8
# and CRS 4 in Coraza: the wiki's requests pass, attacks in addresses and
# headers are still blocked.

SecRule REQUEST_FILENAME "@beginsWith /api/v1/" \
    "id:75100,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'ewiki-crs-exclusions/1',\
    chain"
    SecRule REQUEST_METHOD "@rx ^(?:POST|PUT|PATCH|DELETE)$" \
        "t:none,\
        chain"
        SecRule REQUEST_HEADERS:Content-Type "@rx ^application/json" \
            "t:none,t:lowercase,\
            ctl:ruleRemoveTargetByTag=attack-xss;ARGS,\
            ctl:ruleRemoveTargetByTag=attack-xss;REQUEST_BODY,\
            ctl:ruleRemoveTargetByTag=attack-sqli;ARGS,\
            ctl:ruleRemoveTargetByTag=attack-sqli;REQUEST_BODY,\
            ctl:ruleRemoveTargetByTag=attack-rce;ARGS,\
            ctl:ruleRemoveTargetByTag=attack-rce;REQUEST_BODY,\
            ctl:ruleRemoveTargetByTag=attack-lfi;ARGS,\
            ctl:ruleRemoveTargetByTag=attack-lfi;REQUEST_BODY,\
            ctl:ruleRemoveTargetByTag=attack-rfi;ARGS,\
            ctl:ruleRemoveTargetByTag=attack-rfi;REQUEST_BODY,\
            ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS,\
            ctl:ruleRemoveTargetByTag=attack-injection-php;REQUEST_BODY,\
            ctl:ruleRemoveTargetByTag=attack-injection-nodejs;ARGS,\
            ctl:ruleRemoveTargetByTag=attack-injection-nodejs;REQUEST_BODY,\
            ctl:ruleRemoveTargetByTag=attack-injection-java;ARGS,\
            ctl:ruleRemoveTargetByTag=attack-injection-java;REQUEST_BODY,\
            ctl:ruleRemoveTargetByTag=attack-injection-generic;ARGS,\
            ctl:ruleRemoveTargetByTag=attack-injection-generic;REQUEST_BODY,\
            ctl:ruleRemoveTargetByTag=attack-generic;ARGS,\
            ctl:ruleRemoveTargetByTag=attack-generic;REQUEST_BODY,\
            ctl:ruleRemoveTargetByTag=attack-ssti;ARGS,\
            ctl:ruleRemoveTargetByTag=attack-ssti;REQUEST_BODY,\
            ctl:ruleRemoveTargetByTag=attack-fixation;ARGS,\
            ctl:ruleRemoveTargetByTag=attack-fixation;REQUEST_BODY"

SecRule REQUEST_FILENAME "@beginsWith /api/v1/" \
    "id:75102,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'ewiki-crs-exclusions/1',\
    setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"

# The search term may contain code (searching for "<script>" or a line of
# SQL in a manual, a path like ../etc/hosts); it is only searched for,
# never run, opened or shown unescaped. The path of this route is fixed, so
# the path rules may skip its address (which carries the search term).
SecRule REQUEST_FILENAME "@rx ^/(?:api/v1/)?search$" \
    "id:75101,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ver:'ewiki-crs-exclusions/1',\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:q,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:q,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:q,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:q,\
    ctl:ruleRemoveTargetByTag=attack-lfi;REQUEST_URI,\
    ctl:ruleRemoveTargetByTag=attack-lfi;REQUEST_URI_RAW,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:q,\
    ctl:ruleRemoveTargetByTag=attack-injection-generic;ARGS:q,\
    ctl:ruleRemoveTargetByTag=attack-generic;ARGS:q"

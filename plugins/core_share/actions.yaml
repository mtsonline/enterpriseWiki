# Action register (ewiki.plugin.v1.Action, see sdk/proto/ewiki/plugin/v1/action.proto).
actions:
  - id: core.share.check
    category: CATEGORY_ACTION
    method: POST
    path: check
    summary:
      text:
        en: Who would be notified when sharing (without sending)
        de: Wer beim Teilen benachrichtigt würde (ohne zu senden)
    permission: {key: core.share.use, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [share, check]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['core.users.create#default', 'core.categories.create#default', 'core.categories.acl.add#user_view']
        body_json: '{"target_type": "category", "target_id": ${given.core.categories.create#default.id}, "users": [${given.core.users.create#default.id}]}'
        expect_json: '{"recipients": 1}'
  - id: core.share.send
    category: CATEGORY_ACTION
    method: POST
    path: share
    summary:
      text:
        en: "Share a page: notify people, groups or roles (only those you may list)"
        de: "Seite teilen: Personen, Gruppen oder Rollen benachrichtigen (nur die, die Sie auflisten dürfen)"
    permission: {key: core.share.use, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [share, send]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['core.users.create#default', 'core.categories.create#default', 'core.categories.acl.add#user_view']
        body_json: '{"target_type": "category", "target_id": ${given.core.categories.create#default.id}, "users": [${given.core.users.create#default.id}], "message": "Please have a look."}'
        expect_json: '{"recipients": 1}'
      - name: to_self
        given: ['core.categories.create#default', 'core.categories.acl.add#self_view']
        body_json: '{"target_type": "category", "target_id": ${given.core.categories.create#default.id}, "users": [${self.id}], "message": "For you."}'
        expect_json: '{"recipients": 1}'

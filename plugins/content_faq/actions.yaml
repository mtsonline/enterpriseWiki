# Action register (ewiki.plugin.v1.Action, see sdk/proto/ewiki/plugin/v1/action.proto).
actions:
  - id: content.faq.questions.list
    category: CATEGORY_ACTION
    method: GET
    path: "elements/{id}/questions"
    success_status: 200
    summary:
      text:
        en: List the questions of an FAQ
        de: Fragen einer FAQ auflisten
    permission: {key: core.category.view, scope: SCOPE_CATEGORY, category_param: "element:id"}
    cli: {command: [faq, questions], args: [id]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['core.elements.create#faq']
        as: member
        path_params_json: '{"id": "${given.core.elements.create#faq.id}"}'
  - id: content.faq.feed
    category: CATEGORY_ACTION
    method: GET
    path: "elements/{id}/feed"
    success_status: 200
    summary:
      text:
        en: Feed of an FAQ (RSS/Atom; with the personal feed link also private)
        de: Feed einer FAQ (RSS/Atom; mit persönlichem Feed-Link auch privat)
    public: true
    cli: {command: [faq, feed], args: [id]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['core.elements.create#faq', 'core.elements.create#faq_question']
        path_params_json: '{"id": "${given.core.elements.create#faq.id}"}'

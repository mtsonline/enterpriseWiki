# Action register (ewiki.plugin.v1.Action, see sdk/proto/ewiki/plugin/v1/action.proto).
actions:
  - id: content.faq.questions.list
    category: CATEGORY_ACTION
    method: GET
    path: "elements/{id}/questions"
    success_status: 200
    summary:
      text:
        en: List the questions of an FAQ
        de: Fragen einer FAQ auflisten
    permission: {key: core.category.view, scope: SCOPE_CATEGORY, category_param: "element:id"}
    cli: {command: [faq, questions], args: [id]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['core.elements.create#faq']
        as: member
        path_params_json: '{"id": "${given.core.elements.create#faq.id}"}'
  - id: content.faq.questions.create
    category: CATEGORY_ACTION
    method: POST
    path: "elements/{id}/questions"
    success_status: 201
    summary:
      text:
        en: Add a question to an FAQ (needs create in the category)
        de: Frage zu einer FAQ hinzufügen (braucht Anlegen in der Kategorie)
    safety: {changes: true}
    permission: {key: core.category.create, scope: SCOPE_CATEGORY, category_param: "element:id"}
    cli: {command: [faq, question], args: [id]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['core.elements.create#faq']
        as: member
        path_params_json: '{"id": "${given.core.elements.create#faq.id}"}'
        body_json: '{"title": "How do I start? ${unique}", "body": {"format": "html", "source": "<p>Like this.</p>"}}'
        status: 201
  - id: content.faq.categories.create
    category: CATEGORY_ACTION
    method: POST
    path: "elements/{id}/categories"
    success_status: 201
    summary:
      text:
        en: Add a section to an FAQ (needs manage)
        de: Abschnitt zu einer FAQ hinzufügen (braucht Verwalten)
    safety: {changes: true}
    permission: {key: core.category.manage, scope: SCOPE_CATEGORY, category_param: "element:id"}
    cli: {command: [faq, category], args: [id]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['core.elements.create#faq']
        as: member
        path_params_json: '{"id": "${given.core.elements.create#faq.id}"}'
        body_json: '{"titles": {"en": "Section ${unique}"}}'
        status: 201
  - id: content.faq.feed
    category: CATEGORY_ACTION
    method: GET
    path: "elements/{id}/feed"
    success_status: 200
    summary:
      text:
        en: Feed of an FAQ (RSS/Atom; with the personal feed link also private)
        de: Feed einer FAQ (RSS/Atom; mit persönlichem Feed-Link auch privat)
    public: true
    cli: {command: [faq, feed], args: [id]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['core.elements.create#faq', 'content.faq.questions.create#default']
        path_params_json: '{"id": "${given.core.elements.create#faq.id}"}'

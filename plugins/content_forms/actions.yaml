# Action register (ewiki.plugin.v1.Action, see sdk/proto/ewiki/plugin/v1/action.proto).
actions:
  - id: content.forms.meta
    category: CATEGORY_ACTION
    method: GET
    path: meta
    summary:
      text:
        en: Field types and options of forms
        de: Feldarten und Optionen von Formularen
    public: true
    cli: {command: [form, meta]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        as: member
  - id: content.forms.start
    category: CATEGORY_ACTION
    method: GET
    path: "elements/{id}/start"
    summary:
      text:
        en: Open a form for filling in
        de: Formular zum Ausfüllen öffnen
    permission: {key: core.category.view, scope: SCOPE_CATEGORY, category_param: "element:id"}
    cli: {command: [form, start], args: [id]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['core.elements.create#form']
        as: member
        path_params_json: '{"id": "${given.core.elements.create#form.id}"}'
      - name: admin
        given: ['core.elements.create#form']
        path_params_json: '{"id": "${given.core.elements.create#form.id}"}'
      - name: self
        given: ['core.elements.create#form', 'core.categories.acl.add#self_view']
        as: self
        path_params_json: '{"id": "${given.core.elements.create#form.id}"}'
  - id: content.forms.submit
    category: CATEGORY_ACTION
    method: POST
    path: "elements/{id}/submit"
    summary:
      text:
        en: Submit a form
        de: Formular absenden
    permission: {key: core.category.view, scope: SCOPE_CATEGORY, category_param: "element:id"}
    safety: {changes: true}
    cli: {command: [form, submit], args: [id]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['core.elements.create#form', 'core.categories.acl.add#self_view', 'content.forms.start#self']
        as: self
        path_params_json: '{"id": "${given.core.elements.create#form.id}"}'
        query_json: '{"lang": "en"}'
        body_json: '{"token": "${given.content.forms.start#self.token}", "values": {"name": "Ann"}}'
        status: 201
      - name: admin
        given: ['core.elements.create#form', 'content.forms.start#admin']
        path_params_json: '{"id": "${given.core.elements.create#form.id}"}'
        query_json: '{"lang": "en"}'
        status: 201
        form:
          - {name: data, value: '{"token": "${given.content.forms.start#admin.token}", "values": {"name": "Ann"}}'}
        files:
          - {field: file.doc, name: 'note.txt', content_type: 'text/plain', text: 'Hello'}
  - id: content.forms.submissions.list
    category: CATEGORY_ACTION
    method: GET
    path: "elements/{id}/submissions"
    summary:
      text:
        en: List the submissions of a form (also for the creator of the form)
        de: "Einsendungen eines Formulars auflisten (auch für die Person, die es angelegt hat)"
    permission: {key: content.forms.submissions, scope: SCOPE_CATEGORY, category_param: "element:id"}
    cli: {command: [form, submissions], args: [id]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['core.elements.create#form', 'content.forms.submit#admin']
        as: member
        path_params_json: '{"id": "${given.core.elements.create#form.id}"}'
      - name: admin
        given: ['core.elements.create#form', 'content.forms.submit#admin']
        path_params_json: '{"id": "${given.core.elements.create#form.id}"}'
  - id: content.forms.submissions.csv
    category: CATEGORY_ACTION
    method: GET
    path: "elements/{id}/submissions.csv"
    summary:
      text:
        en: Export the submissions as CSV (also for the creator of the form)
        de: Einsendungen als CSV exportieren (auch für die Person, die das Formular angelegt hat)
    permission: {key: content.forms.submissions_export, scope: SCOPE_CATEGORY, category_param: "element:id"}
    cli: {command: [form, export-csv], args: [id]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['core.elements.create#form', 'content.forms.submit#admin']
        as: member
        path_params_json: '{"id": "${given.core.elements.create#form.id}"}'
  - id: content.forms.submissions.xlsx
    category: CATEGORY_ACTION
    method: GET
    path: "elements/{id}/submissions.xlsx"
    summary:
      text:
        en: Export the submissions as Excel file (also for the creator of the form)
        de: Einsendungen als Excel-Datei exportieren (auch für die Person, die das Formular angelegt hat)
    permission: {key: content.forms.submissions_export, scope: SCOPE_CATEGORY, category_param: "element:id"}
    cli: {command: [form, export-xlsx], args: [id]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['core.elements.create#form', 'content.forms.submit#admin']
        as: member
        path_params_json: '{"id": "${given.core.elements.create#form.id}"}'
  - id: content.forms.submissions.get
    category: CATEGORY_ACTION
    method: GET
    path: "submissions/{sid}"
    summary:
      text:
        en: Show a submission (needs content.forms.submissions)
        de: Einsendung anzeigen (braucht content.forms.submissions)
    signed_in: true
    cli: {command: [form, submission], args: [sid]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['content.forms.submissions.list#admin']
        path_params_json: '{"sid": "${given.content.forms.submissions.list#admin.items.0.id}"}'
  - id: content.forms.submissions.delete
    category: CATEGORY_ACTION
    method: DELETE
    path: "submissions/{sid}"
    summary:
      text:
        en: Delete a submission (needs content.forms.submissions_delete)
        de: Einsendung löschen (braucht content.forms.submissions_delete)
    signed_in: true
    safety: {changes: true}
    cli: {command: [form, submission-delete], args: [sid]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['content.forms.submissions.list#admin']
        path_params_json: '{"sid": "${given.content.forms.submissions.list#admin.items.0.id}"}'
        status: 204
  - id: content.forms.submissions.file
    category: CATEGORY_ACTION
    method: GET
    path: "submissions/{sid}/files/{n}"
    summary:
      text:
        en: Download a file of a submission (needs content.forms.submissions)
        de: Datei einer Einsendung herunterladen (braucht content.forms.submissions)
    signed_in: true
    cli: {command: [form, submission-file], args: [sid, n]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['content.forms.submissions.list#admin']
        path_params_json: '{"sid": "${given.content.forms.submissions.list#admin.items.0.id}", "n": "0"}'

# Action register (ewiki.plugin.v1.Action, see sdk/proto/ewiki/plugin/v1/action.proto).
actions:
  - id: core.carousel.position
    category: CATEGORY_ACTION
    method: GET
    path: "position/{position}"
    success_status: 200
    summary:
      text:
        en: Carousels of a position with their slides (only what you may see)
        de: "Karussells einer Position mit ihren Folien (nur, was Sie sehen dürfen)"
    public: true
    cli: {command: [carousel, position], args: [position]}
    ui: {entry: /}
    examples:
      - name: default
        given: ['core.carousel.create#default']
        as: guest
        path_params_json: '{"position": "home-top"}'
  - id: core.carousel.shown
    category: CATEGORY_ACTION
    method: GET
    path: shown
    success_status: 200
    summary:
      text:
        en: All carousels you see, with their slides and default position (each carousel is a block of the placement)
        de: "Alle Karussells, die Sie sehen, mit Folien und Vorgabe-Position (jedes Karussell ist ein Baustein der Platzierung)"
    public: true
    cli: {command: [carousel, shown]}
    ui: {entry: /}
    examples:
      - name: default
        given: ['core.carousel.create#default']
        as: guest
  - id: core.carousel.targets
    category: CATEGORY_ACTION
    method: GET
    path: targets
    success_status: 200
    summary:
      text:
        en: Carousels news can be published to (empty without core.carousel.publish or core.carousel.manage)
        de: "Karussells, in denen Neuigkeiten erscheinen können (leer ohne core.carousel.publish oder core.carousel.manage)"
    public: true
    cli: {command: [carousel, targets]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['core.carousel.create#default']
      - name: none
        as: outsider
        expect_json: '[]'
  - id: core.carousel.list
    category: CATEGORY_ACTION
    method: GET
    path: carousels
    success_status: 200
    summary:
      text:
        en: List the carousels
        de: Karussells auflisten
    permission: {key: core.carousel.manage, scope: SCOPE_GLOBAL}
    cli: {command: [carousel, list]}
    ui: {entry: /admin/carousels}
    examples:
      - name: default
        as: member
  - id: core.carousel.create
    category: CATEGORY_ACTION
    method: POST
    path: carousels
    success_status: 201
    summary:
      text:
        en: Create a carousel
        de: Karussell anlegen
    permission: {key: core.carousel.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [carousel, create]}
    ui: {entry: /admin/carousels}
    examples:
      - name: default
        as: member
        body_json: '{"name": "Start ${unique}", "position": "home-top", "audience": "all", "autoplay": 0, "max_slides": 5, "enabled": true}'
        status: 201
  - id: core.carousel.update
    category: CATEGORY_ACTION
    method: PUT
    path: "carousels/{id}"
    success_status: 200
    summary:
      text:
        en: Change a carousel
        de: Karussell ändern
    permission: {key: core.carousel.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [carousel, update], args: [id]}
    ui: {entry: /admin/carousels}
    examples:
      - name: default
        given: ['core.carousel.create#default']
        as: member
        path_params_json: '{"id": "${given.core.carousel.create#default.id}"}'
        body_json: '{"name": "Start ${unique}", "position": "home-top", "audience": "users", "autoplay": 8, "max_slides": 3, "enabled": true}'
  - id: core.carousel.delete
    category: CATEGORY_ACTION
    method: DELETE
    path: "carousels/{id}"
    success_status: 204
    summary:
      text:
        en: Delete a carousel
        de: Karussell löschen
    permission: {key: core.carousel.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [carousel, delete], args: [id]}
    ui: {entry: /admin/carousels}
    examples:
      - name: default
        given: ['core.carousel.create#default']
        as: member
        path_params_json: '{"id": "${given.core.carousel.create#default.id}"}'
        status: 204
  - id: core.carousel.slides.list
    category: CATEGORY_ACTION
    method: GET
    path: "carousels/{id}/slides"
    success_status: 200
    summary:
      text:
        en: List the slides of a carousel
        de: Folien eines Karussells auflisten
    permission: {key: core.carousel.manage, scope: SCOPE_GLOBAL}
    cli: {command: [carousel, slides], args: [id]}
    ui: {entry: /admin/carousels}
    examples:
      - name: default
        given: ['core.carousel.create#default', 'core.carousel.slides.create#default']
        as: member
        path_params_json: '{"id": "${given.core.carousel.create#default.id}"}'
  - id: core.carousel.slides.create
    category: CATEGORY_ACTION
    method: POST
    path: "carousels/{id}/slides"
    success_status: 201
    summary:
      text:
        en: Add a slide
        de: Folie hinzufügen
    permission: {key: core.carousel.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [carousel, slide-add], args: [id]}
    ui: {entry: /admin/carousels}
    examples:
      - name: default
        given: ['core.carousel.create#default']
        as: member
        path_params_json: '{"id": "${given.core.carousel.create#default.id}"}'
        body_json: '{"kind": "manual", "title": "Welcome", "text": "Our new wiki", "link": "/search"}'
        status: 201
      - name: second
        given: ['core.carousel.create#default']
        path_params_json: '{"id": "${given.core.carousel.create#default.id}"}'
        body_json: '{"kind": "manual", "title": "Second", "text": "More"}'
        status: 201
  - id: core.carousel.slides.update
    category: CATEGORY_ACTION
    method: PUT
    path: "carousels/{id}/slides/{slide}"
    success_status: 200
    summary:
      text:
        en: Change a slide
        de: Folie ändern
    permission: {key: core.carousel.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [carousel, slide-update], args: [id, slide]}
    ui: {entry: /admin/carousels}
    examples:
      - name: default
        given: ['core.carousel.create#default', 'core.carousel.slides.create#default']
        as: member
        path_params_json: '{"id": "${given.core.carousel.create#default.id}", "slide": "${given.core.carousel.slides.create#default.id}"}'
        body_json: '{"kind": "manual", "title": "Welcome!", "text": "Changed"}'
  - id: core.carousel.slides.delete
    category: CATEGORY_ACTION
    method: DELETE
    path: "carousels/{id}/slides/{slide}"
    success_status: 204
    summary:
      text:
        en: Remove a slide
        de: Folie entfernen
    permission: {key: core.carousel.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [carousel, slide-remove], args: [id, slide]}
    ui: {entry: /admin/carousels}
    examples:
      - name: default
        given: ['core.carousel.create#default', 'core.carousel.slides.create#default']
        as: member
        path_params_json: '{"id": "${given.core.carousel.create#default.id}", "slide": "${given.core.carousel.slides.create#default.id}"}'
        status: 204
  - id: core.carousel.order
    category: CATEGORY_ACTION
    method: PUT
    path: "carousels/{id}/order"
    success_status: 204
    summary:
      text:
        en: Change the order of the slides
        de: Reihenfolge der Folien ändern
    permission: {key: core.carousel.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [carousel, order], args: [id]}
    ui: {entry: /admin/carousels}
    examples:
      - name: default
        given: ['core.carousel.create#default', 'core.carousel.slides.create#default', 'core.carousel.slides.create#second']
        as: member
        path_params_json: '{"id": "${given.core.carousel.create#default.id}"}'
        body_json: '{"slides": [${given.core.carousel.slides.create#second.id}, ${given.core.carousel.slides.create#default.id}]}'
  - id: core.carousel.refresh
    category: CATEGORY_ACTION
    method: POST
    path: "carousels/{id}/refresh"
    success_status: 204
    summary:
      text:
        en: Fill a carousel again from its source
        de: Karussell erneut aus seiner Quelle füllen
    permission: {key: core.carousel.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [carousel, refresh], args: [id]}
    ui: {entry: /admin/carousels}
    examples:
      - name: default
        given: ['core.carousel.create#default']
        as: member
        path_params_json: '{"id": "${given.core.carousel.create#default.id}"}'

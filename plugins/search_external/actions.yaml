# Action register (ewiki.plugin.v1.Action, see sdk/proto/ewiki/plugin/v1/action.proto).
actions:
  - id: search.external.status
    category: CATEGORY_ACTION
    method: GET
    path: status
    success_status: 200
    summary:
      text:
        en: Show the state of the external search
        de: Zustand der externen Suche anzeigen
    permission: {key: search.external.manage, scope: SCOPE_GLOBAL}
    cli: {command: [external-search, status]}
    ui: {entry: /admin/search}
    examples:
      - name: default
        as: member
  - id: search.external.test
    category: CATEGORY_ACTION
    method: POST
    path: test
    success_status: 200
    summary:
      text:
        en: Test the connection to the external search
        de: Verbindung zur externen Suche testen
    permission: {key: search.external.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [external-search, test]}
    ui: {entry: /admin/search}
    examples:
      - name: opensearch
        as: member
        requires: [opensearch]
        given: [core.settings.update#search_opensearch]
      - name: elasticsearch
        as: member
        requires: [elasticsearch]
        given: [core.settings.update#search_elasticsearch]
      - name: meilisearch
        as: member
        requires: [meilisearch]
        given: [core.settings.update#search_meilisearch]
      - name: wrong_key
        as: member
        requires: [meilisearch]
        given: [core.settings.update#search_meilisearch_wrong_key]
        status: 400
  - id: search.external.reindex
    category: CATEGORY_ACTION
    method: POST
    path: reindex
    success_status: 204
    summary:
      text:
        en: Index all content again
        de: Alle Inhalte neu indizieren
    permission: {key: search.external.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [external-search, reindex]}
    ui: {entry: /admin/search}
    examples:
      - name: opensearch
        as: member
        requires: [opensearch]
        given: [core.settings.update#search_opensearch]
      - name: elasticsearch
        as: member
        requires: [elasticsearch]
        given: [core.settings.update#search_elasticsearch]
      - name: meilisearch
        as: member
        requires: [meilisearch]
        given: [core.settings.update#search_meilisearch]

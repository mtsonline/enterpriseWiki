# Action register (ewiki.plugin.v1.Action, see sdk/proto/ewiki/plugin/v1/action.proto).
actions:
  - id: office.collabora.test
    category: CATEGORY_ACTION
    method: POST
    path: test
    summary:
      text:
        en: Test the connection to the office server
        de: Verbindung zum Office-Server testen
    permission: {key: core.settings.manage, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [office, collabora-test]}
    ui: {entry: /admin/collabora}
    examples:
      - name: default
        as: member
        requires: [collabora]
        given: [core.settings.update#collabora]
        expect_json: '{"ok": true, "configured": true, "proof_key": true}'

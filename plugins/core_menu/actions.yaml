# Action register (ewiki.plugin.v1.Action, see sdk/proto/ewiki/plugin/v1/action.proto).
actions:
  - id: core.menu.list
    category: CATEGORY_ACTION
    method: GET
    path: menus
    summary:
      text:
        en: List the placed menus as you see them (all=1, every menu as stored, needs core.menu.edit)
        de: Platzierte Menüs so auflisten, wie Sie sie sehen (all=1, alle Menüs wie gespeichert, braucht core.menu.edit)
    public: true
    cli: {command: [menu, list]}
    ui: {entry: /admin/menus}
    examples:
      - name: default
        as: guest
      - name: all
        given: ['core.menu.create#default']
        query_json: '{"all": "1"}'
      - name: all_refused
        as: outsider
        query_json: '{"all": "1"}'
        status: 403
  - id: core.menu.get
    category: CATEGORY_ACTION
    method: GET
    path: "menus/{id}"
    summary:
      text:
        en: Show a menu
        de: Menü anzeigen
    permission: {key: core.menu.edit, scope: SCOPE_GLOBAL}
    cli: {command: [menu, show], args: [id]}
    ui: {entry: /admin/menus}
    examples:
      - name: default
        given: ['core.menu.create#default']
        as: member
        path_params_json: '{"id": "${given.core.menu.create#default.id}"}'
  - id: core.menu.create
    category: CATEGORY_ACTION
    method: POST
    path: menus
    summary:
      text:
        en: Create a menu
        de: Menü anlegen
    permission: {key: core.menu.edit, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [menu, create]}
    ui: {entry: /admin/menus}
    examples:
      - name: default
        as: member
        body_json: '{"name": "Links ${unique}", "location": "", "items": [{"label": {"en": "Example"}, "type": "url", "url": "https://example.com/"}]}'
        status: 201
  - id: core.menu.update
    category: CATEGORY_ACTION
    method: PUT
    path: "menus/{id}"
    summary:
      text:
        en: Change a menu
        de: Menü ändern
    permission: {key: core.menu.edit, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [menu, update], args: [id]}
    ui: {entry: /admin/menus}
    examples:
      - name: default
        given: ['core.menu.create#default']
        as: member
        path_params_json: '{"id": "${given.core.menu.create#default.id}"}'
        body_json: '{"name": "Links ${unique}", "location": "", "items": []}'
  - id: core.menu.delete
    category: CATEGORY_ACTION
    method: DELETE
    path: "menus/{id}"
    summary:
      text:
        en: Delete a menu
        de: Menü löschen
    permission: {key: core.menu.edit, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [menu, delete], args: [id]}
    ui: {entry: /admin/menus}
    examples:
      - name: default
        given: ['core.menu.create#default']
        as: member
        path_params_json: '{"id": "${given.core.menu.create#default.id}"}'
        status: 204

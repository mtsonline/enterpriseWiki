# Action register (ewiki.plugin.v1.Action, see sdk/proto/ewiki/plugin/v1/action.proto).
actions:
  - id: content.events.list
    category: CATEGORY_ACTION
    method: GET
    path: "calendars/{id}/events"
    summary:
      text:
        en: List the events of a calendar in a time range
        de: Termine eines Kalenders in einem Zeitraum auflisten
    permission: {key: core.category.view, scope: SCOPE_CATEGORY, category_param: "element:id"}
    cli: {command: [event, list], args: [id]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['core.elements.create#calendar', 'content.events.create#default']
        as: member
        path_params_json: '{"id": "${given.core.elements.create#calendar.id}"}'
        query_json: '{"from": "2030-01-01", "to": "2030-02-01"}'
  - id: content.events.create
    category: CATEGORY_ACTION
    method: POST
    path: "calendars/{id}/events"
    summary:
      text:
        en: Create an event in a calendar (as the calendar allows)
        de: Termin in einem Kalender anlegen (wie der Kalender es erlaubt)
    permission: {key: core.category.create, scope: SCOPE_CATEGORY, category_param: "element:id"}
    safety: {changes: true}
    cli: {command: [event, create], args: [id]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['core.elements.create#calendar']
        as: member
        path_params_json: '{"id": "${given.core.elements.create#calendar.id}"}'
        body_json: '{"title": "Team meeting", "location": "Room 1", "starts_at": "2030-01-07T09:00:00Z", "ends_at": "2030-01-07T10:00:00Z", "tz": "Europe/Vienna", "registration": true, "capacity": 10}'
        status: 201
      - name: series
        given: ['core.elements.create#calendar']
        path_params_json: '{"id": "${given.core.elements.create#calendar.id}"}'
        body_json: '{"title": "Weekly", "starts_at": "2030-01-07T09:00:00Z", "ends_at": "2030-01-07T10:00:00Z", "tz": "Europe/Vienna", "rrule": "FREQ=WEEKLY;COUNT=4"}'
        status: 201
  - id: content.events.calendar_ical
    category: CATEGORY_ACTION
    method: GET
    path: "calendars/{id}/ical"
    summary:
      text:
        en: Calendar as iCalendar subscription (with the personal feed link also private)
        de: Kalender als iCalendar-Abo (mit persönlichem Feed-Link auch privat)
    public: true
    cli: {command: [event, calendar-ical], args: [id]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['core.elements.create#calendar', 'content.events.create#default']
        path_params_json: '{"id": "${given.core.elements.create#calendar.id}"}'
  - id: content.events.get
    category: CATEGORY_ACTION
    method: GET
    path: "events/{id}"
    summary:
      text:
        en: Show an event (only what you may see)
        de: "Termin anzeigen (nur, was Sie sehen dürfen)"
    public: true
    cli: {command: [event, show], args: [id]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['content.events.create#default']
        path_params_json: '{"id": "${given.content.events.create#default.id}"}'
        expect_json: '{"event": {"title": "Team meeting"}}'
  - id: content.events.update
    category: CATEGORY_ACTION
    method: PUT
    path: "events/{id}"
    summary:
      text:
        en: Change an event (own ones or as manager of the calendar)
        de: Termin ändern (eigene oder als Verwalter des Kalenders)
    signed_in: true
    safety: {changes: true}
    cli: {command: [event, update], args: [id]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['content.events.create#default']
        path_params_json: '{"id": "${given.content.events.create#default.id}"}'
        body_json: '{"title": "Team meeting (moved)", "starts_at": "2030-01-08T09:00:00Z", "ends_at": "2030-01-08T10:00:00Z", "tz": "Europe/Vienna"}'
  - id: content.events.delete
    category: CATEGORY_ACTION
    method: DELETE
    path: "events/{id}"
    summary:
      text:
        en: Delete an event (own ones or as manager of the calendar)
        de: Termin löschen (eigene oder als Verwalter des Kalenders)
    signed_in: true
    safety: {changes: true}
    cli: {command: [event, delete], args: [id]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['content.events.create#default']
        path_params_json: '{"id": "${given.content.events.create#default.id}"}'
        status: 204
  - id: content.events.ical
    category: CATEGORY_ACTION
    method: GET
    path: "events/{id}/ical"
    summary:
      text:
        en: Download an event as .ics (only what you may see)
        de: "Termin als .ics herunterladen (nur, was Sie sehen dürfen)"
    public: true
    cli: {command: [event, ical], args: [id]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['content.events.create#default']
        path_params_json: '{"id": "${given.content.events.create#default.id}"}'
  - id: content.events.occurrence.update
    category: CATEGORY_ACTION
    method: PUT
    path: "events/{id}/occurrences/{date}"
    summary:
      text:
        en: Change one occurrence of a series
        de: Einen Termin einer Serie ändern
    signed_in: true
    safety: {changes: true}
    cli: {command: [event, occurrence-update], args: [id, date]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['content.events.create#series']
        path_params_json: '{"id": "${given.content.events.create#series.id}", "date": "2030-01-14"}'
        body_json: '{"location": "Room 2"}'
  - id: content.events.occurrence.reset
    category: CATEGORY_ACTION
    method: DELETE
    path: "events/{id}/occurrences/{date}"
    summary:
      text:
        en: Reset one occurrence to the series
        de: Einen Termin einer Serie zurücksetzen
    signed_in: true
    safety: {changes: true}
    cli: {command: [event, occurrence-reset], args: [id, date]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['content.events.create#series', 'content.events.occurrence.update#default']
        path_params_json: '{"id": "${given.content.events.create#series.id}", "date": "2030-01-14"}'
        status: 204
  - id: content.events.registrations.list
    category: CATEGORY_ACTION
    method: GET
    path: "events/{id}/registrations"
    summary:
      text:
        en: List the registrations of an event (managers of the event)
        de: Anmeldungen zu einem Termin auflisten (Verwalter des Termins)
    signed_in: true
    cli: {command: [event, registrations], args: [id]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['content.events.create#default', 'content.events.register#admin']
        path_params_json: '{"id": "${given.content.events.create#default.id}"}'
      - name: admin
        given: ['content.events.create#default', 'content.events.register#admin']
        path_params_json: '{"id": "${given.content.events.create#default.id}"}'
  - id: content.events.register
    category: CATEGORY_ACTION
    method: POST
    path: "events/{id}/registrations"
    summary:
      text:
        en: Register for an event
        de: Zu einem Termin anmelden
    signed_in: true
    safety: {changes: true}
    cli: {command: [event, register], args: [id]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['content.events.create#default', 'core.categories.acl.add#self_view']
        as: self
        path_params_json: '{"id": "${given.content.events.create#default.id}"}'
        body_json: '{"occurrence": "2030-01-07", "note": "Vegetarian"}'
      - name: admin
        given: ['content.events.create#default']
        path_params_json: '{"id": "${given.content.events.create#default.id}"}'
        body_json: '{"occurrence": "2030-01-07"}'
  - id: content.events.unregister
    category: CATEGORY_ACTION
    method: DELETE
    path: "events/{id}/registrations"
    summary:
      text:
        en: Cancel your registration for an event
        de: Eigene Anmeldung zu einem Termin zurückziehen
    signed_in: true
    safety: {changes: true}
    cli: {command: [event, unregister], args: [id]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['content.events.register#default']
        as: self
        path_params_json: '{"id": "${given.content.events.create#default.id}"}'
        query_json: '{"occurrence": "2030-01-07"}'
        status: 204
  - id: content.events.registrations.remove
    category: CATEGORY_ACTION
    method: DELETE
    path: "events/{id}/registrations/{rid}"
    summary:
      text:
        en: Remove a registration (managers of the event)
        de: Anmeldung entfernen (Verwalter des Termins)
    signed_in: true
    safety: {changes: true}
    cli: {command: [event, registration-remove], args: [id, rid]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['content.events.create#default', 'content.events.registrations.list#admin']
        path_params_json: '{"id": "${given.content.events.create#default.id}", "rid": "${given.content.events.registrations.list#admin.0.id}"}'
        status: 204
  - id: content.events.my_registrations
    category: CATEGORY_ACTION
    method: GET
    path: me/registrations
    summary:
      text:
        en: List your registrations
        de: Eigene Anmeldungen auflisten
    signed_in: true
    cli: {command: [event, my-registrations]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['content.events.register#default']
        as: self
  - id: content.events.upcoming
    category: CATEGORY_ACTION
    method: GET
    path: upcoming
    summary:
      text:
        en: List the upcoming events (only what you may see)
        de: "Kommende Termine auflisten (nur, was Sie sehen dürfen)"
    public: true
    cli: {command: [event, upcoming]}
    ui: {entry: /}
    examples:
      - name: default
        given: ['content.events.create#default']

# Action register (ewiki.plugin.v1.Action, see sdk/proto/ewiki/plugin/v1/action.proto).
actions:
  - id: core.blocks.list
    category: CATEGORY_ACTION
    method: GET
    path: blocks
    success_status: 200
    summary:
      text:
        en: List the blocks you may see (to place them)
        de: Bausteine auflisten, die Sie sehen dürfen (zum Platzieren)
    public: true
    cli: {command: [block, list]}
    ui: {entry: /admin/placement}
    examples:
      - name: default
        given: ['core.elements.create#block']
  - id: core.blocks.placements
    category: CATEGORY_ACTION
    method: GET
    path: "blocks/{id}/placements"
    success_status: 200
    summary:
      text:
        en: Where a block is shown (for those who may edit it)
        de: Wo ein Baustein erscheint (für alle, die ihn bearbeiten dürfen)
    permission: {key: core.category.edit, scope: SCOPE_CATEGORY, category_param: "element:id"}
    cli: {command: [block, placements], args: [id]}
    ui: {entry: /e/:id}
    examples:
      - name: default
        given: ['core.elements.create#block']
        as: member
        path_params_json: '{"id": ${given.core.elements.create#block.id}}'

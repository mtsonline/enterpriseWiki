# Action register (ewiki.plugin.v1.Action, see sdk/proto/ewiki/plugin/v1/action.proto).
actions:
  - id: core.blocks.list
    category: CATEGORY_ACTION
    method: GET
    path: blocks
    success_status: 200
    summary:
      text:
        en: List the blocks shown to you (all=1 with their sources needs core.blocks.edit)
        de: Blöcke auflisten, die Sie sehen (all=1 mit Quelltext braucht core.blocks.edit)
    public: true
    cli: {command: [block, list]}
    ui: {entry: /admin/blocks}
    examples:
      - name: default
        given: ['core.blocks.create#default']
        as: guest
      - name: all
        given: ['core.blocks.create#default']
        query_json: '{"all": "1"}'
      - name: all_refused
        as: outsider
        query_json: '{"all": "1"}'
        status: 403
  - id: core.blocks.create
    category: CATEGORY_ACTION
    method: POST
    path: blocks
    success_status: 201
    summary:
      text:
        en: Create a block
        de: Block anlegen
    permission: {key: core.blocks.edit, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [block, create]}
    ui: {entry: /admin/blocks}
    examples:
      - name: default
        as: member
        body_json: '{"name": "Notice ${unique}", "location": "sidebar", "position": 1, "audience": "all", "enabled": true, "titles": {"en": "Notice"}, "bodies": {"en": {"format": "html", "source": "<p>Office closed on Friday.</p>"}}}'
        status: 201
  - id: core.blocks.update
    category: CATEGORY_ACTION
    method: PUT
    path: "blocks/{id}"
    success_status: 200
    summary:
      text:
        en: Change a block
        de: Block ändern
    permission: {key: core.blocks.edit, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [block, update], args: [id]}
    ui: {entry: /admin/blocks}
    examples:
      - name: default
        given: ['core.blocks.create#default']
        as: member
        path_params_json: '{"id": "${given.core.blocks.create#default.id}"}'
        body_json: '{"name": "Notice ${unique}", "location": "sidebar", "position": 2, "audience": "users", "enabled": false, "titles": {"en": "Changed"}, "bodies": {"en": {"format": "html", "source": "<p>Changed.</p>"}}}'
  - id: core.blocks.delete
    category: CATEGORY_ACTION
    method: DELETE
    path: "blocks/{id}"
    success_status: 204
    summary:
      text:
        en: Delete a block
        de: Block löschen
    permission: {key: core.blocks.edit, scope: SCOPE_GLOBAL}
    safety: {changes: true}
    cli: {command: [block, delete], args: [id]}
    ui: {entry: /admin/blocks}
    examples:
      - name: default
        given: ['core.blocks.create#default']
        as: member
        path_params_json: '{"id": "${given.core.blocks.create#default.id}"}'
        status: 204

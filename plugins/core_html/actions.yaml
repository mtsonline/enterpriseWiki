# Action register (ewiki.plugin.v1.Action, see sdk/proto/ewiki/plugin/v1/action.proto).
actions:
  - id: core.html.to_html
    category: CATEGORY_ACTION
    method: POST
    path: edit-html
    summary:
      text:
        en: Turn Markdown into HTML for the HTML editor
        de: Markdown in HTML für den HTML-Editor umwandeln
    signed_in: true
    safety: {changes: true}
    cli: {command: [html, to-html]}
    ui: {entry: /e/:id/edit}
    examples:
      - name: default
        as: member
        body_json: '{"source": "# Title\n\nSome *text*."}'
  - id: core.html.to_markdown
    category: CATEGORY_ACTION
    method: POST
    path: to-markdown
    summary:
      text:
        en: Turn HTML into Markdown
        de: HTML in Markdown umwandeln
    signed_in: true
    safety: {changes: true}
    cli: {command: [html, to-markdown]}
    ui: {entry: /e/:id/edit}
    examples:
      - name: default
        as: member
        body_json: '{"source": "<h1>Title</h1><p>Some <em>text</em>.</p>"}'

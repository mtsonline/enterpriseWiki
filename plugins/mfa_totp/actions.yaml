# Action register (ewiki.plugin.v1.Action, see sdk/proto/ewiki/plugin/v1/action.proto).
actions:
  - id: mfa.totp.me
    category: CATEGORY_ACTION
    method: GET
    path: me
    summary:
      text:
        en: Show whether your authenticator app is set up
        de: "Anzeigen, ob die Authenticator-App eingerichtet ist"
    signed_in: true
    cli: {command: [me, totp]}
    ui: {entry: /profile}
  - id: mfa.totp.remove
    category: CATEGORY_ACTION
    method: DELETE
    path: me
    summary:
      text:
        en: Remove your authenticator app as a factor
        de: Authenticator-App als Faktor entfernen
    signed_in: true
    safety: {changes: true}
    ui: {entry: /profile}
    exceptions:
      - way: WAY_CLI
        reason: "Second factors are set up and removed only in the browser, within 15 minutes after signing in (passkeys need the browser anyway)."
        approved_by: "project owner, decision of 2026-11-11 (second factors are only changed in the browser)"

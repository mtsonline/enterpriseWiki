server:
  port: 8080
  environment: "production"

i18n:
  original_language: "de"
  supported_languages: ["de", "en", "fr", "es"]

template:
  active_template: "theme.default.modern"
  available_templates:
    - id: "theme.default.modern"
      name: "Modern Enterprise Dark Theme"
      extends: null
    - id: "theme.custom.corporate"
      name: "Corporate Blue Extension"
      extends: "theme.default.modern"

plugins:
  core.html:
    name: "WYSIWYG Rich-Text Plugin"
    enabled: true
    version: "6.0.0"
  core.list:
    name: "Category Element List Plugin"
    enabled: true
    version: "6.0.0"
  workflow.engine:
    name: "Enterprise Multi-Step Workflow Engine"
    enabled: true
    version: "6.0.0"
  search.fulltext:
    name: "Fulltext Search Plugin"
    enabled: true
    version: "6.0.0"
  menu.manager:
    name: "Dynamic Menu Plugin"
    enabled: true
    version: "6.0.0"

// DRAFT for review (phase P2, SDK 1.0.0-preview).
//
// Services the HOST (the wiki) offers; the plugin calls them on the host's
// Unix socket. Every access goes through the host and is checked: rights,
// limits, inputs, audit (concept rule 3). The only way around it is the
// plugin's own database schema (and the outbox functions in it).
//
// The host's services are split by area; each area is a capability
// ("content@1", "people@1", ...) the plugin declares in its manifest
// (requires / optional). Calls to an area the plugin did not declare, or
// whose grant the administrator did not confirm, fail with
// PERMISSION_DENIED and an ErrorInfo naming what is missing ("grant
// mail.send is missing in the manifest").
//
// This file: the handshake and the basics every plugin has ("host@1").
syntax = "proto3";

package ewiki.plugin.v1;

import "ewiki/plugin/v1/common.proto";

option go_package = "github.com/mtsonline/enterprisewiki/sdk/proto/ewiki/plugin/v1;pluginv1";

service Host {
  // Handshake, the first call. The host started the process and handed it
  // a one-time start secret on standard input (never in the environment
  // or the command line). The plugin proves it with the secret; the host
  // answers with the session and what was granted.
  rpc Hello(HelloRequest) returns (HelloResponse);

  // Settings and limits (current values; changes also come as
  // Plugin.SettingsChanged).
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);

  // Does the person of the call token have a permission (core or the
  // plugin's own)? Without a call token: the plugin account.
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);
  // Several at once (for lists: which rows may this person change).
  rpc CheckPermissions(CheckPermissionsRequest) returns (CheckPermissionsResponse);

  // License status, for display only: nothing is ever locked (concept 7).
  rpc GetLicense(GetLicenseRequest) returns (GetLicenseResponse);

  // What the wiki has set up (mail, office, AI, federation, ...), so a
  // plugin can offer only what works (honest interface).
  rpc Status(StatusRequest) returns (StatusResponse);

  // Translate the wiki's own UI keys (core and this plugin), with plural
  // forms, for texts the plugin sends (e-mails, chat messages).
  rpc Translate(TranslateRequest) returns (TranslateResponse);
}

message HelloRequest {
  // Versions of the contract the plugin speaks ("v1"); the host picks one.
  repeated string protocols = 1;
  // Transport version, so the transport can change without changing the
  // contract ("grpc-unix/1").
  string transport = 2;
  string start_secret = 3;
  string plugin_id = 4;
  string plugin_version = 5;
  // SHA-256 of the manifest the plugin was built with; must match the
  // installed package.
  bytes manifest_sha256 = 6;
  // SDK version the plugin was built with ("1.0.0-preview.3"), for the
  // administration and support.
  string sdk_version = 7;
}

message HelloResponse {
  string protocol = 1;
  // Session token for the metadata "ewiki-session" of every call in both
  // directions. Valid until the process ends.
  string session = 2;
  // Grants the administrator confirmed and capabilities the host offers
  // ("content@1", "events@1", ...).
  repeated string granted = 3;
  repeated string capabilities = 4;
  // Connection to the plugin's own database schema (own role, only this
  // schema and the outbox functions); empty if the manifest has no
  // database.
  string database_url = 5;
  // Outgoing connections only through this proxy (HTTP CONNECT and plain
  // HTTP on a Unix socket), to the targets the administrator confirmed
  // (net:<host>). With the header "Ewiki-Connection: <name>" the proxy
  // adds the credentials of a connection (Data.Connections); the plugin
  // never sees them.
  string net_proxy = 6;
  string net_proxy_token = 7;
  // OpenTelemetry: the host accepts OTLP (gRPC) on this Unix socket and
  // forwards traces, metrics and logs with the plugin id to the wiki's
  // monitoring. Logs on standard error (JSON lines) are collected too.
  string telemetry_socket = 8;
  // Where this instance of the plugin runs: the cluster node (for logs;
  // jobs and singletons are coordinated by the host) and the instance
  // host name (federation).
  string node = 9;
  string instance = 10;
}

message GetSettingsRequest {
  // Instance of a provider ("ldap-corp"); empty for the plugin's settings.
  string instance = 1;
  // Site: settings can differ per site; empty for the main site.
  string site = 2;
}

message GetSettingsResponse {
  // Settings as JSON matching the schema. Secret fields come as stored;
  // they only leave the host to this plugin, never to the browser.
  string settings_json = 1;
  map<string, int64> limits = 2;
}

message CheckPermissionRequest {
  string key = 1;
  // For category permissions: the category (or an element in it).
  ObjectRef object = 2;
}

message CheckPermissionResponse {
  bool allowed = 1;
}

message CheckPermissionsRequest {
  repeated CheckPermissionRequest checks = 1;
}

message CheckPermissionsResponse {
  // Same order as the request.
  repeated bool allowed = 1;
}

message GetLicenseRequest {}

message GetLicenseResponse {
  // Features of the license that cover this plugin ("pro.auth").
  repeated string features = 1;
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_LICENSED = 1;
    STATUS_NOT_LICENSED = 2;
    STATUS_EXPIRED = 3;
  }
  // Status for this plugin. Informational: the plugin must keep working
  // in every status.
  Status status = 2;
  string licensee = 3;
}

message StatusRequest {}

message StatusResponse {
  // Services ready for use: "mail", "office", "ai", "translation",
  // "federation", "cluster", "search.external", "calendar", ...
  repeated string ready = 1;
  // Sites of this wiki and whether each keeps its own accounts.
  message Site {
    string name = 1;
    bool own_accounts = 2;
    repeated string hostnames = 3;
  }
  repeated Site sites = 2;
}

message TranslateRequest {
  string language = 1;
  repeated TranslateKey keys = 2;
}

message TranslateKey {
  string key = 1;
  map<string, string> params = 2;
  // For plural forms (CLDR).
  optional int64 count = 3;
}

message TranslateResponse {
  // Same order as the request.
  repeated string texts = 1;
}

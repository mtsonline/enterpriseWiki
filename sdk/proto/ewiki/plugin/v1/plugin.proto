// DRAFT for review (phase P2, SDK 1.0.0-preview).
//
// Service EVERY plugin offers; the host calls it on the Unix socket the
// host named at the start. The extension points of the areas (element
// types, sign-in, search, ...) are separate services in ext_*.proto; a
// plugin serves those it declares in its manifest, and the host checks
// after Hello that they answer.
//
// Every call carries the session token from the handshake in the metadata
// "ewiki-session"; the SDK refuses calls without it. Every call has a
// deadline; calls on the path of a page view must answer within the
// plugin's call timeout, otherwise the host shows an honest notice instead
// of waiting longer.
syntax = "proto3";

package ewiki.plugin.v1;

import "ewiki/plugin/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/mtsonline/enterprisewiki/sdk/proto/ewiki/plugin/v1;pluginv1";

service Plugin {
  // Lifecycle. Start comes once after a successful Hello, Stop before the
  // host ends the process (it waits for running calls up to the deadline).
  rpc Start(StartRequest) returns (StartResponse);
  rpc Stop(StopRequest) returns (StopResponse);
  // Sign of life, every few seconds. Missing answers or a crash make the
  // host restart the plugin with growing waits; after repeated crashes it
  // switches the plugin off and tells the administrators. Data stays.
  rpc Ping(PingRequest) returns (PingResponse);

  // Settings changed by an administrator. ValidateSettings is asked first,
  // before anything is stored; the plugin may refuse.
  rpc ValidateSettings(ValidateSettingsRequest) returns (ValidateSettingsResponse);
  rpc SettingsChanged(SettingsChangedRequest) returns (SettingsChangedResponse);
  // "Test connection" in the settings (to a directory, a server, ...).
  rpc TestSettings(TestSettingsRequest) returns (TestSettingsResponse);

  // A request to one of the plugin's actions (/api/v1/x/<plugin-id>/...)
  // or inbound endpoints. The host has already checked sign-in (or the
  // signature of an inbound endpoint), CSRF, rate limits, size, the
  // permission and the parameters against the action's schema, and it
  // writes the audit entry. First message: the head, then body chunks.
  rpc HandleHTTP(stream HttpRequestPart) returns (stream HttpResponsePart);

  // A timed job or a manual run of one (in a cluster on one node only).
  rpc RunJob(RunJobRequest) returns (RunJobResponse);

  // Messages from the plugin's instances on other nodes and from the same
  // plugin on partner wikis (see host_live.proto).
  rpc ClusterMessage(ClusterMessageRequest) returns (ClusterMessageResponse);
  rpc FederationMessage(FederationMessageRequest) returns (FederationMessageResponse);
}

message StartRequest {
  // What the administrator confirmed and the host offers.
  repeated string granted = 1;
  repeated string capabilities = 2;
  // Current settings (JSON matching the settings schema) and limits.
  string settings_json = 3;
  map<string, int64> limits = 4;
  // Version of the wiki, for logs only: plugins check capabilities, not
  // versions.
  string host_version = 5;
  // True in development mode (preview APIs allowed, no signature check).
  bool development = 6;
  // Sites the plugin is enabled on (multi-site); empty: only the main
  // site.
  repeated string sites = 7;
}

message StartResponse {}

message StopRequest {
  google.protobuf.Timestamp deadline = 1;
}

message StopResponse {}

message PingRequest {}

message PingResponse {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_OK = 1;
    // Running, but a part does not work (e.g. its directory server is
    // unreachable); the administration shows the message.
    STATE_DEGRADED = 2;
  }
  State state = 1;
  string message = 2;
}

message ValidateSettingsRequest {
  // Instance of a provider ("ldap-corp"); empty for the plugin's settings.
  string instance = 1;
  string site = 2;
  string settings_json = 3;
}

message ValidateSettingsResponse {
  // Empty when the settings are fine; one entry per problem, with field.
  repeated ErrorInfo problems = 1;
}

message SettingsChangedRequest {
  string instance = 1;
  string site = 2;
  string settings_json = 3;
}

message SettingsChangedResponse {}

message TestSettingsRequest {
  string instance = 1;
  string site = 2;
  // Settings as entered, not yet stored.
  string settings_json = 3;
}

message TestSettingsResponse {
  bool ok = 1;
  // Steps of the test with their result, for the administration
  // ("connect", "bind", "search").
  message Step {
    string name = 1;
    bool ok = 2;
    string message = 3;
  }
  repeated Step steps = 2;
}

message HttpRequestPart {
  oneof part {
    HttpRequestHead head = 1;
    // Body in chunks of at most 64 KiB; the total is limited by the
    // action's body limit.
    Chunk body = 2;
  }
}

message HttpRequestHead {
  CallContext context = 1;
  string method = 2;
  // Path below /api/v1/x/<plugin-id>/ and the raw query.
  string path = 3;
  string query = 4;
  // Path parameters, already checked against the schema (JSON object).
  string path_params_json = 5;
  // Only harmless headers (Accept, Accept-Language, Content-Type,
  // If-Match, If-None-Match, Range, and for inbound endpoints the headers
  // the endpoint declares); never cookies, Authorization or the client's
  // address.
  map<string, string> headers = 6;
}

message HttpResponsePart {
  oneof part {
    HttpResponseHead head = 1;
    Chunk body = 2;
  }
}

message HttpResponseHead {
  int32 status = 1;
  // Allowed: Content-Type, Content-Disposition, Cache-Control, ETag,
  // Last-Modified, Location (inside the wiki). The host sets the security
  // headers itself and refuses others.
  map<string, string> headers = 2;
}

message RunJobRequest {
  string name = 1;
  // The plugin account for the schedule, or the person who started it.
  Principal triggered_by = 2;
  bool dry_run = 3;
  // Site the job runs for (jobs run per site where the plugin is
  // enabled).
  string site = 4;
}

message RunJobResponse {
  // Summary for the job history in the administration.
  string summary = 1;
  // Details as JSON (shown and exported as they are).
  string report_json = 2;
}

message ClusterMessageRequest {
  string topic = 1;
  bytes payload = 2;
  string from_node = 3;
}

message ClusterMessageResponse {}

message FederationMessageRequest {
  // Partner wiki the message comes from (verified by the federation).
  string instance = 1;
  string type = 2;
  bytes payload = 3;
  // With a person: who on the partner wiki sent it, and the context to
  // call the host for them (the rights of this wiki apply).
  CallContext context = 4;
}

message FederationMessageResponse {
  bytes payload = 1;
}

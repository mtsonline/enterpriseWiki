# Quick start:
#   cp .env.example .env   # set passwords
#   docker compose up -d
#   open http://localhost:8080  (user: admin, password: EWIKI_ADMIN_PASSWORD)
# Updates: "docker compose up -d" pulls the newest image every time
# (pull_policy: always). With own plugins in plugins/ build the image locally
# instead: comment out "image" and "pull_policy", uncomment "build" and run
# "docker compose up -d --build".
services:
  postgres:
    # PostgreSQL with automatic, verified major version upgrades (dump in the
    # pgbackup volume, old data kept); see docs/admin/operations.md
    image: ghcr.io/mtsonline/enterprisewiki-postgres:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      POSTGRES_DB: ewiki
      POSTGRES_USER: ewiki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/ewiki
      - pgbackup:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ewiki -d ewiki"]
      interval: 10s
      timeout: 5s
      retries: 10
      # an upgrade to a new major version (dump and restore) may take a while
      start_period: 6h
      start_interval: 5s

  wiki:
    image: ghcr.io/mtsonline/enterprisewiki:latest   # or a fixed version, e.g. :7.5
    pull_policy: always
    # build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      EWIKI_DATABASE_URL: postgres://ewiki:${POSTGRES_PASSWORD}@postgres:5432/ewiki?sslmode=disable
      EWIKI_ADMIN_USER: ${EWIKI_ADMIN_USER:-admin}
      EWIKI_ADMIN_PASSWORD: ${EWIKI_ADMIN_PASSWORD:?set EWIKI_ADMIN_PASSWORD in .env}
      EWIKI_SITE_NAME: ${EWIKI_SITE_NAME:-Enterprise Wiki}
      EWIKI_BASE_URL: ${EWIKI_BASE_URL:-http://localhost:8080}
      EWIKI_LANGUAGES: ${EWIKI_LANGUAGES:-en,de}
      # outgoing e-mail (used on first setup; later in Administration -> E-mail)
      EWIKI_MAIL_FROM: ${EWIKI_MAIL_FROM:-}
      EWIKI_SMTP_HOST: ${EWIKI_SMTP_HOST:-}
      EWIKI_SMTP_PORT: ${EWIKI_SMTP_PORT:-}
      EWIKI_SMTP_SECURITY: ${EWIKI_SMTP_SECURITY:-}
      EWIKI_SMTP_USER: ${EWIKI_SMTP_USER:-}
      EWIKI_SMTP_PASSWORD: ${EWIKI_SMTP_PASSWORD:-}
    ports:
      - "8080:8080"
    volumes:
      - wikidata:/data

  # Optional external search engine for very large wikis (plugin search.external,
  # Administration -> Search engine: engine meilisearch, URL http://meilisearch:7700).
  # meilisearch:
  #   image: getmeili/meilisearch:v1.10
  #   restart: unless-stopped
  #   environment:
  #     MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
  #     MEILI_ENV: production
  #   volumes:
  #     - meilidata:/meili_data

volumes:
  # meilidata:
  pgdata:
  pgbackup:
  wikidata:

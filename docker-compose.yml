services:
  postgres:
    image: postgres:16-alpine
    container_name: wiki-db
    environment:
      POSTGRES_DB: enterprisewiki
      POSTGRES_USER: wikiuser
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikiuser -d enterprisewiki"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    container_name: wiki-backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=wikiuser
      - DB_PASSWORD=secretpassword
      - DB_NAME=enterprisewiki
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wiki-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:

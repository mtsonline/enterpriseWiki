# Quick start:
#   cp .env.example .env   # set passwords
#   docker compose up -d --build
#   open http://localhost:8080  (user: admin, password: EWIKI_ADMIN_PASSWORD)
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ewiki
      POSTGRES_USER: ewiki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ewiki -d ewiki"]
      interval: 5s
      timeout: 5s
      retries: 10

  wiki:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      EWIKI_DATABASE_URL: postgres://ewiki:${POSTGRES_PASSWORD}@postgres:5432/ewiki?sslmode=disable
      EWIKI_ADMIN_USER: ${EWIKI_ADMIN_USER:-admin}
      EWIKI_ADMIN_PASSWORD: ${EWIKI_ADMIN_PASSWORD:?set EWIKI_ADMIN_PASSWORD in .env}
      EWIKI_SITE_NAME: ${EWIKI_SITE_NAME:-Enterprise Wiki}
      EWIKI_BASE_URL: ${EWIKI_BASE_URL:-http://localhost:8080}
      EWIKI_LANGUAGES: ${EWIKI_LANGUAGES:-en,de}
    ports:
      - "8080:8080"
    volumes:
      - wikidata:/data

volumes:
  pgdata:
  wikidata:

# Enterprise Wiki built locally from this directory (e.g. with own plugins in
# plugins/), instead of the published image. Builds the full image, so
# plugins can also be installed in the administration later.
#
#   ./docker-setup.sh
#   docker compose -f docker-compose.build.yml up -d --build
#
# Same layout as docker-compose.yml: data in ./data, containers run as your user.
# Tip: "export COMPOSE_FILE=docker-compose.build.yml" saves the -f option
# (./docker-postgres-upgrade.sh respects COMPOSE_FILE as well).
services:
  postgres:
    # the official PostgreSQL image; major upgrades with ./docker-postgres-upgrade.sh
    image: postgres:${POSTGRES_VERSION:-18}
    user: "${EWIKI_UID:?run ./docker-setup.sh}:${EWIKI_GID:?run ./docker-setup.sh}"
    restart: unless-stopped
    networks: [ewiki]
    environment:
      POSTGRES_DB: ewiki
      POSTGRES_USER: ewiki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # one directory per major version (data/postgres/18/docker, …/19/docker)
      PGDATA: /var/lib/postgresql/${POSTGRES_VERSION:-18}/docker
    volumes:
      - ./data/postgres:/var/lib/postgresql
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ewiki -d ewiki"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 2m
      start_interval: 5s

  wiki:
    build:
      context: .
      target: full   # or lite (no plugin installation)
    user: "${EWIKI_UID:?run ./docker-setup.sh}:${EWIKI_GID:?run ./docker-setup.sh}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      EWIKI_DATABASE_URL: postgres://ewiki:${POSTGRES_PASSWORD}@postgres:5432/ewiki?sslmode=disable
      EWIKI_ADMIN_USER: ${EWIKI_ADMIN_USER:-admin}
      EWIKI_ADMIN_PASSWORD: ${EWIKI_ADMIN_PASSWORD:?set EWIKI_ADMIN_PASSWORD in .env}
      EWIKI_SITE_NAME: ${EWIKI_SITE_NAME:-Enterprise Wiki}
      EWIKI_BASE_URL: ${EWIKI_BASE_URL:-http://localhost:8080}
      EWIKI_LANGUAGES: ${EWIKI_LANGUAGES:-en,de}
      # outgoing e-mail (used on first setup; later in Administration -> E-mail)
      EWIKI_MAIL_FROM: ${EWIKI_MAIL_FROM:-}
      EWIKI_SMTP_HOST: ${EWIKI_SMTP_HOST:-}
      EWIKI_SMTP_PORT: ${EWIKI_SMTP_PORT:-}
      EWIKI_SMTP_SECURITY: ${EWIKI_SMTP_SECURITY:-}
      EWIKI_SMTP_USER: ${EWIKI_SMTP_USER:-}
      EWIKI_SMTP_PASSWORD: ${EWIKI_SMTP_PASSWORD:-}
      # reverse proxies whose X-Forwarded-For is trusted (client addresses
      # for logs, rate limits and allowed networks of accounts):
      # 172.30.80.250 = the bundled proxy, 172.30.80.1 = a proxy on the host
      # (nginx, Apache) that connects to EWIKI_PORT
      EWIKI_TRUSTED_PROXIES: ${EWIKI_TRUSTED_PROXIES:-172.30.80.250}
      # bundled office servers (profiles collabora / onlyoffice): presets of
      # the plugin settings, the proxy may get certificates for their hosts
      EWIKI_EXTRA_TLS_HOSTS: ${EWIKI_COLLABORA_HOST:-},${EWIKI_ONLYOFFICE_HOST:-}
      EWIKI_COLLABORA_URL: ${EWIKI_COLLABORA_URL:-}
      EWIKI_ONLYOFFICE_URL: ${EWIKI_ONLYOFFICE_URL:-}
      EWIKI_ONLYOFFICE_INTERNAL_URL: ${EWIKI_ONLYOFFICE_INTERNAL_URL:-}
      EWIKI_ONLYOFFICE_JWT_SECRET: ${EWIKI_ONLYOFFICE_JWT_SECRET:-}
      EWIKI_MEDIA_VIEWER: ${EWIKI_MEDIA_VIEWER:-}
    # the office servers send saved files and fetch documents through the
    # proxy (their public addresses), without leaving the host
    extra_hosts:
      - "${EWIKI_ONLYOFFICE_HOST:-onlyoffice.invalid}:${EWIKI_PROXY_IP:-172.30.80.250}"
    ports:
      - "${EWIKI_PORT:-8080}:8080"
    volumes:
      - ./data/wiki:/data
    networks: [ewiki]

  # Optional reverse proxy with automatic HTTPS (COMPOSE_PROFILES=proxy in
  # .env). It gets certificates for the base URL and the host names of all
  # sites on their first visit and renews them; ports 80 and 443 must be
  # reachable from the internet (HTTP-01 / TLS-ALPN-01 challenges).
  proxy:
    image: caddy:2
    profiles: [proxy]
    restart: unless-stopped
    # unprivileged: ports below 1024 need no capability inside containers
    user: "${EWIKI_UID:?run ./docker-setup.sh}:${EWIKI_GID:?run ./docker-setup.sh}"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    depends_on: [wiki]
    environment:
      EWIKI_ACME: ${EWIKI_ACME:-letsencrypt}
      EWIKI_ACME_EMAIL: ${EWIKI_ACME_EMAIL:-}
    command: ["sh", "-c", "[ -n \"$$EWIKI_ACME_EMAIL\" ] || { echo 'set EWIKI_ACME_EMAIL in .env (needed for certificates)' >&2; exit 1; }; exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"]
    ports:
      - "${EWIKI_HTTP_PORT:-80}:80"
      - "${EWIKI_HTTPS_PORT:-443}:443"
      - "${EWIKI_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./docker/caddy:/etc/caddy:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    networks:
      ewiki:
        ipv4_address: ${EWIKI_PROXY_IP:-172.30.80.250}

  # Optional Collabora Online (CODE) for office files (COMPOSE_PROFILES=proxy,collabora).
  # Reached at https://EWIKI_COLLABORA_HOST through the proxy; it calls the
  # wiki at EWIKI_BASE_URL (allowed as WOPI host via aliasgroup1).
  collabora:
    image: collabora/code:${COLLABORA_VERSION:-25.04.9.4.1}
    profiles: [collabora]
    # the image ships without proof key: create one at the start, so the
    # wiki can verify that WOPI requests come from this server
    entrypoint: ["/bin/sh", "-c", "[ -s /etc/coolwsd/proof_key ] || coolconfig generate-proof-key; exec /start-collabora-online.sh"]
    restart: unless-stopped
    # the image runs as its own unprivileged user "cool"; the document jails
    # need these capabilities (no other ones)
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, MKNOD, SYS_CHROOT, SETUID, SETGID, DAC_OVERRIDE]
    environment:
      aliasgroup1: ${EWIKI_BASE_URL:-http://localhost:8080}
      server_name: ${EWIKI_COLLABORA_HOST:-localhost:9980}
      DONT_GEN_SSL_CERT: "1"
      extra_params: >-
        --o:ssl.enable=false --o:ssl.termination=${EWIKI_COLLABORA_TLS_TERMINATION:-true}
        --o:admin_console.enable=false --o:welcome.enable=false
        --o:remote_font_config.url= --o:home_mode.enable=true
        --o:mount_jail_tree=false
    extra_hosts:
      - "${EWIKI_DOMAIN:-wiki.invalid}:${EWIKI_PROXY_IP:-172.30.80.250}"
    networks: [ewiki]

  # Optional OnlyOffice Docs for office files (COMPOSE_PROFILES=proxy,onlyoffice).
  # Reached at https://EWIKI_ONLYOFFICE_HOST; all requests are signed with
  # EWIKI_ONLYOFFICE_JWT_SECRET (generated by ./docker-setup.sh). Needs about
  # 4 GB RAM. The image runs its services (incl. its own database and queue)
  # inside the container as root; it is only reachable through the proxy.
  onlyoffice:
    image: onlyoffice/documentserver:${ONLYOFFICE_VERSION:-9.4}
    profiles: [onlyoffice]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${EWIKI_ONLYOFFICE_JWT_SECRET:-}
      JWT_HEADER: Authorization
      # the wiki is a private address of this network: allow it
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "false"
    extra_hosts:
      - "${EWIKI_DOMAIN:-wiki.invalid}:${EWIKI_PROXY_IP:-172.30.80.250}"
    # no volumes: documents live in the wiki, the server only keeps a cache
    networks: [ewiki]

  # Optional external search engine for very large wikis (plugin search.external,
  # Administration -> Search engine: engine meilisearch, URL http://meilisearch:7700).
  # meilisearch:
  #   image: getmeili/meilisearch:v1.10
  #   user: "${EWIKI_UID}:${EWIKI_GID}"
  #   restart: unless-stopped
  #   environment:
  #     MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
  #     MEILI_ENV: production
  #   volumes:
  #     - ./data/meilisearch:/meili_data

networks:
  ewiki:
    ipam:
      config:
        # fixed, so the proxy address in EWIKI_TRUSTED_PROXIES stays valid
        # (when changing it, set EWIKI_PROXY_IP and EWIKI_TRUSTED_PROXIES too)
        - subnet: ${EWIKI_SUBNET:-172.30.80.0/24}
          # containers get addresses from the lower half; the proxy has a
          # fixed one in the upper half (EWIKI_PROXY_IP), so they never collide
          ip_range: ${EWIKI_IP_RANGE:-172.30.80.0/25}

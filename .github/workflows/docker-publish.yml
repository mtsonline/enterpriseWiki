# Publishes the Docker images after CI passed on main (also after automatic
# updates by Renovate) and for version tags. Two variants:
#   lite (only the binary)        full (plus source and toolchains: builds plugins)
#   …/enterprisewiki:latest       …/enterprisewiki:full          newest main
#   …/enterprisewiki:7.5.0        …/enterprisewiki:7.5.0-full    release tags v7.5.0 (plus 7.5, 7)
#   …/enterprisewiki:sha-abc1234  …/enterprisewiki:sha-abc1234-full
# The package stays private until its visibility is changed on GitHub.
name: Docker image
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        variant: [lite, full]
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - id: version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/enterprisewiki" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          context: git
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
            suffix=${{ matrix.variant == 'full' && '-full' || '' }},onlatest=false
          tags: |
            type=raw,value=latest,suffix=,enable=${{ github.event_name == 'workflow_run' && matrix.variant == 'lite' }}
            type=raw,value=full,suffix=,enable=${{ github.event_name == 'workflow_run' && matrix.variant == 'full' }}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: ${{ matrix.variant }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

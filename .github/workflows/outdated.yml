# Daily check that every component is on its newest stable version (Go
# toolchain, Go modules, npm packages, Node.js LTS). Renovate updates them
# automatically; this job fails when an update is stuck for more than 7 days
# (e.g. a Renovate pull request with failing CI), so nothing stays outdated.
name: Outdated components
on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  outdated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Go version from go.mod
        id: gover
        run: echo "version=$(sed -n 's/^toolchain go//p' go.mod | grep . || sed -n 's/^go //p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version: "${{ steps.gover.outputs.version }}" }
      - name: newest stable versions
        run: go run ./tools/outdated

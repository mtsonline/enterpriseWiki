name: CI

on:
  push:
  pull_request:
  # canary.yml calls this workflow nightly with latest: true – everything is
  # upgraded to the newest versions first (without committing) as an early warning
  workflow_call:
    inputs:
      latest:
        type: boolean
        default: false

permissions:
  contents: read

env:
  DB_URL: postgres://wiki:wiki@localhost:5432/wiki?sslmode=disable

jobs:
  backend:
    name: Backend (lint, unit + API integration tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ inputs.latest && 'latest' || '18' }} # renovate: postgres 18
        env: { POSTGRES_USER: wiki, POSTGRES_PASSWORD: wiki, POSTGRES_DB: wiki }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      # the toolchain line of go.mod is the Go version to use (the go line is only the minimum)
      - name: Go version from go.mod
        id: gover
        run: echo "version=$(sed -n 's/^toolchain go//p' go.mod | grep . || sed -n 's/^go //p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        if: ${{ !inputs.latest }}
        with: { go-version: "${{ steps.gover.outputs.version }}" }
      - uses: actions/setup-go@v7
        if: ${{ inputs.latest }}
        with: { go-version: stable, check-latest: true }
      - name: upgrade all Go modules to the newest versions (canary)
        if: ${{ inputs.latest }}
        run: go get -u -t ./... && go mod tidy && git diff --stat go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: generated plugin imports are up to date
        run: go run ./tools/genplugins && git diff --exit-code plugins/all
      - run: go vet ./...
      - name: licenses of all linked modules are allowed (LICENSING.md)
        run: go run ./tools/notices -check
      - name: tests (race detector, real PostgreSQL)
        run: go test -race -count=1 ./...
        env:
          EWIKI_TEST_DATABASE_URL: ${{ env.DB_URL }}

  e2e:
    name: Frontend build, typecheck, browser E2E + WCAG (axe)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ inputs.latest && 'latest' || '18' }} # renovate: postgres 18
        env: { POSTGRES_USER: wiki, POSTGRES_PASSWORD: wiki, POSTGRES_DB: wiki }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      EWIKI_CONFIG: /tmp/wiki/config.yaml
      EWIKI_DATABASE_URL: postgres://wiki:wiki@localhost:5432/wiki?sslmode=disable
      EWIKI_ADMIN_PASSWORD: Admin-Passw0rd!
    steps:
      - uses: actions/checkout@v7
      # the toolchain line of go.mod is the Go version to use (the go line is only the minimum)
      - name: Go version from go.mod
        id: gover
        run: echo "version=$(sed -n 's/^toolchain go//p' go.mod | grep . || sed -n 's/^go //p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        if: ${{ !inputs.latest }}
        with: { go-version: "${{ steps.gover.outputs.version }}" }
      - uses: actions/setup-go@v7
        if: ${{ inputs.latest }}
        with: { go-version: stable, check-latest: true }
      - name: upgrade all Go modules to the newest versions (canary)
        if: ${{ inputs.latest }}
        run: go get -u -t ./... && go mod tidy && git diff --stat go.mod
      - uses: actions/setup-node@v7
        with: { node-version: "${{ inputs.latest && 'latest' || '26' }}" }
      - name: upgrade all npm packages to the newest versions (canary)
        if: ${{ inputs.latest }}
        working-directory: web
        run: npx --yes npm-check-updates@latest -u && npm install --no-audit --no-fund && git diff --stat package.json
      - name: install frontend tooling
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: build (frontend + single binary)
        run: ./scripts/build.sh
      - name: typecheck
        working-directory: web
        run: npm run typecheck
      - name: setup and start the wiki
        run: |
          mkdir -p /tmp/wiki
          ./bin/ewiki setup --non-interactive
          nohup ./bin/ewiki serve > /tmp/wiki/server.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:8080/readyz && break; sleep 1; done
      - name: CLI smoke test
        run: |
          ./bin/ewiki version
          ./bin/ewiki api GET /api/v1/categories
          ./bin/ewiki plugin list
          ./bin/ewiki config get ui.site_name
      - name: install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: browser tests
        working-directory: web
        run: npm run test:e2e
        env:
          EWIKI_E2E_URL: http://localhost:8080
          EWIKI_E2E_USER: admin
          EWIKI_E2E_PASSWORD: Admin-Passw0rd!
          EWIKI_E2E_REQUIRE_AXE: "1"
      - name: server log
        if: always()
        run: cat /tmp/wiki/server.log || true

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: newest base images (canary)
        if: ${{ inputs.latest }}
        run: sed -i -E 's#^FROM (--platform=\S+ )?(node|golang|alpine):\S+#FROM \1\2:latest#' Dockerfile && grep ^FROM Dockerfile
      - run: docker build -t enterprisewiki:ci .

  compose:
    name: Docker Compose – setup, non-root, PostgreSQL upgrade ${{ matrix.from }} → recommended
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        from: ["16", "17"]
    steps:
      - uses: actions/checkout@v7
      - name: upgrade test with the official images (copy and --link)
        run: scripts/test-docker-postgres.sh ${{ matrix.from }} ${{ matrix.from == '16' && '--full' || '' }}

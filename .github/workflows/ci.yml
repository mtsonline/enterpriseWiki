name: CI

on:
  # branches are tested through their pull request (merged with the current
  # main, which is what lands); main after every merge
  push:
    branches: [main]
  pull_request:
  # canary.yml calls this workflow nightly with latest: true – everything is
  # upgraded to the newest versions first (without committing) as an early warning
  workflow_call:
    inputs:
      latest:
        type: boolean
        default: false

permissions:
  contents: read

# a new push to a pull request stops the run of the push before it (its
# result no longer counts); runs on main always finish
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DB_URL: postgres://wiki:wiki@localhost:5432/wiki?sslmode=disable

jobs:
  backend:
    # four parallel parts: lint and all packages except the server; the
    # tests of the server in three shards of about the same running time
    # (tools/testshard, durations in tools/testshard/durations.txt)
    name: Backend (${{ matrix.shard == 0 && 'lint, unit tests' || format('API integration tests {0}/3', matrix.shard) }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ inputs.latest && 'latest' || '19' }} # renovate: postgres 19
        env: { POSTGRES_USER: wiki, POSTGRES_PASSWORD: wiki, POSTGRES_DB: wiki }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # the toolchain line of go.mod is the Go version to use (the go line is only the minimum)
      - name: Go version from go.mod
        id: gover
        run: echo "version=$(sed -n 's/^toolchain go//p' go.mod | grep . || sed -n 's/^go //p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        if: ${{ !inputs.latest }}
        with: { go-version: "${{ steps.gover.outputs.version }}" }
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        if: ${{ inputs.latest }}
        with: { go-version: stable, check-latest: true }
      - name: upgrade all Go modules to the newest versions (canary)
        if: ${{ inputs.latest }}
        run: go get -u -t ./... && go mod tidy && git diff --stat go.mod
      - name: gofmt
        if: ${{ matrix.shard == 0 }}
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: generated plugin imports are up to date
        if: ${{ matrix.shard == 0 }}
        run: go run ./tools/genplugins && git diff --exit-code plugins/all
      - name: go vet
        if: ${{ matrix.shard == 0 }}
        run: go vet ./...
      - name: plugin contract (sdk) compiles; examples and action register match its messages
        if: ${{ matrix.shard == 0 }}
        working-directory: sdk
        run: go vet ./... && go run ./tools/protocheck
      - name: licenses of all linked modules are allowed (LICENSING.md)
        if: ${{ matrix.shard == 0 }}
        run: go run ./tools/notices -check
      - name: documentation complete in German and English, links valid
        if: ${{ matrix.shard == 0 }}
        run: go run ./tools/docscheck
      - name: every trap still fits the code (tools/traps)
        if: ${{ matrix.shard == 0 }}
        run: go run ./tools/traps -fit
      # Renovate waits 3 days before it proposes a new version, but cannot for
      # lock file maintenance and pinning: this covers every lock file change
      - name: new npm package versions are at least 3 days old
        if: ${{ matrix.shard == 0 && !inputs.latest }}
        env:
          BASE: ${{ github.base_ref || 'main' }}
        run: |
          git fetch -q --depth=1 origin "$BASE"
          git show FETCH_HEAD:web/package-lock.json > /tmp/old-lock.json
          go run ./tools/releaseage -old /tmp/old-lock.json -new web/package-lock.json
      - name: tests (race detector, real PostgreSQL)
        env:
          EWIKI_TEST_DATABASE_URL: ${{ env.DB_URL }}
          SHARD: ${{ matrix.shard }}
        run: |
          if [ "$SHARD" = 0 ]; then
            go test -race -count=1 -timeout 30m $(go list ./... | grep -v '/internal/server$')
          else
            go test -race -count=1 -timeout 30m -run "$(go run ./tools/testshard -shard "$SHARD" -of 3 ./internal/server)" ./internal/server
          fi

  security:
    name: Security (govulncheck, gosec, npm audit, security tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Go version from go.mod
        id: gover
        run: echo "version=$(sed -n 's/^toolchain go//p' go.mod | grep . || sed -n 's/^go //p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with: { go-version: "${{ steps.gover.outputs.version }}" }
      - name: known vulnerabilities in Go code and modules (govulncheck)
        run: scripts/govulncheck.sh
      # all rules, including G104 (unchecked errors); every finding is fixed or
      # justified in the code (#nosec Gxxx -- reason)
      - name: static security analysis (gosec)
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -quiet -exclude-generated -exclude-dir=web -conf .gosec.json ./...
      - name: known vulnerabilities in npm packages (all, incl. build tools)
        working-directory: web
        run: npm ci --ignore-scripts && npm audit --audit-level=low
      - name: open redirect and input checks (unit)
        run: go test -count=1 -run 'SafeNext|Networks|IPAllowed|TrustedProxies' ./internal/...

  e2e:
    name: Frontend build, typecheck, browser E2E + WCAG (axe)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ inputs.latest && 'latest' || '19' }} # renovate: postgres 19
        env: { POSTGRES_USER: wiki, POSTGRES_PASSWORD: wiki, POSTGRES_DB: wiki }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      EWIKI_CONFIG: /tmp/wiki/config.yaml
      EWIKI_DATABASE_URL: postgres://wiki:wiki@localhost:5432/wiki?sslmode=disable
      EWIKI_ADMIN_PASSWORD: Admin-Passw0rd!
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # the toolchain line of go.mod is the Go version to use (the go line is only the minimum)
      - name: Go version from go.mod
        id: gover
        run: echo "version=$(sed -n 's/^toolchain go//p' go.mod | grep . || sed -n 's/^go //p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        if: ${{ !inputs.latest }}
        with: { go-version: "${{ steps.gover.outputs.version }}" }
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        if: ${{ inputs.latest }}
        with: { go-version: stable, check-latest: true }
      - name: upgrade all Go modules to the newest versions (canary)
        if: ${{ inputs.latest }}
        run: go get -u -t ./... && go mod tidy && git diff --stat go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: "${{ inputs.latest && 'latest' || '26' }}" }
      - name: upgrade all npm packages to the newest versions (canary)
        if: ${{ inputs.latest }}
        working-directory: web
        run: npx --yes npm-check-updates@latest -u && npm install --no-audit --no-fund && git diff --stat package.json
      - name: install frontend tooling
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: build (frontend + single binary)
        run: ./scripts/build.sh
      - name: typecheck
        working-directory: web
        run: npm run typecheck
      - name: unit tests (editor Markdown)
        working-directory: web
        run: npm run test:unit
      # a real CrowdSec for its page in the administration
      - name: download of CrowdSec (cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ewiki-crowdsec/bin-*
          key: crowdsec-${{ hashFiles('tests/crowdsec/start.sh') }}
      - name: start CrowdSec and the exchange script
        run: |
          tests/crowdsec/start.sh > /tmp/crowdsec.env
          sed -n 's/^export EWIKI_TEST_CROWDSEC_PASSWORD=\(.*\)$/::add-mask::\1/p' /tmp/crowdsec.env
          sed -e 's/^export //' -e "s/^\(EWIKI_TEST_CROWDSEC_CSCLI=\)'\(.*\)'$/\1\2/" /tmp/crowdsec.env >> "$GITHUB_ENV"
          rm /tmp/crowdsec.env
      - name: setup and start the wiki
        run: |
          mkdir -p /tmp/wiki
          ./bin/ewiki setup --non-interactive
          # the webhook and carousel tests use receivers and feeds on this machine (refused by default)
          ./bin/ewiki config set webhooks.allow_private true
          ./bin/ewiki config set feeds.allow_private true
          nohup ./bin/ewiki serve > /tmp/wiki/server.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:8080/readyz && break; sleep 1; done
      - name: CLI smoke test
        run: |
          ./bin/ewiki version
          ./bin/ewiki api GET /api/v1/categories
          ./bin/ewiki plugin list
          ./bin/ewiki config get ui.site_name
      - name: install browser
        working-directory: web
        # the package mirrors fail now and then: up to three tries
        run: for try in 1 2 3; do npx playwright install --with-deps chromium && break; [ "$try" = 3 ] && exit 1; sleep $((try * 30)); done
      - name: browser tests
        working-directory: web
        run: npm run test:e2e
        env:
          EWIKI_E2E_URL: http://localhost:8080
          EWIKI_E2E_USER: admin
          EWIKI_E2E_UI_REQUESTS: /tmp/wiki/ui-requests.json
          EWIKI_E2E_PASSWORD: Admin-Passw0rd!
          EWIKI_E2E_REQUIRE_AXE: "1"
      - name: every action of the interface is used by the browser test
        run: go run ./tools/uicoverage -requests /tmp/wiki/ui-requests.json
      - name: no warnings of net/http in the server log
        run: |
          if grep -n 'superfluous response.WriteHeader' /tmp/wiki/server.log; then
            echo "a handler wrote a second status line (return httpx.Handled after writing the answer)" >&2
            exit 1
          fi
      - name: server log
        if: always()
        run: cat /tmp/wiki/server.log || true

  docker:
    name: Docker images (lite, full and plugin builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: newest base images (canary)
        if: ${{ inputs.latest }}
        # keep the image variant: golang:1.27-alpine → golang:alpine (golang:latest is
        # Debian without apk), plain versions such as alpine:3.24 → alpine:latest
        run: |
          sed -i -E \
            -e 's#^FROM (--platform=\S+ )?(node|golang|alpine):[^ -]+( |$)#FROM \1\2:latest\3#' \
            -e 's#^FROM (--platform=\S+ )?(node|golang):[^ -]+-(\S+)#FROM \1\2:\3#' \
            Dockerfile && grep ^FROM Dockerfile
      - run: docker build --target lite -t enterprisewiki:ci .
      - name: image scan (known vulnerabilities HIGH/CRITICAL with a fix, secrets)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
            --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln,secret enterprisewiki:ci
      - name: Dockerfile and compose misconfigurations (HIGH/CRITICAL)
        run: |
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:latest config --exit-code 1 --severity HIGH,CRITICAL /src
      - name: plugins in the full and lite images (build at start, restart, dropped plugin)
        run: scripts/test-docker-plugins.sh
      - name: access setup and bundled reverse proxy (docker-setup.sh questions, unprivileged Caddy)
        run: scripts/test-docker-proxy.sh enterprisewiki:ci
      - name: docker-setup.sh run by root (own user, group docker, files and containers of that user)
        run: sudo scripts/test-docker-setup-root.sh enterprisewiki:ci
      - name: bundled reverse proxy (Caddyfile for every CA, compose profile)
        run: |
          for ca in letsencrypt letsencrypt-staging zerossl; do
            docker run --rm -e EWIKI_ACME_EMAIL=ci@example.com -e EWIKI_ACME=$ca -v "$PWD/docker/caddy:/etc/caddy:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile
          done
          # the Caddy build with the CrowdSec bouncer (docker-compose.crowdsec.yml)
          docker build -q -t ewiki-caddy-crowdsec:ci docker/caddy-crowdsec >/dev/null
          for sec in none crowdsec; do
            docker run --rm --tmpfs /logs:uid=1000,gid=1000 -e EWIKI_ACME_EMAIL=ci@example.com -e EWIKI_SECURITY=$sec -e CROWDSEC_BOUNCER_KEY=ci -v "$PWD/docker/caddy:/etc/caddy:ro" ewiki-caddy-crowdsec:ci caddy validate --config /etc/caddy/Caddyfile
          done
          cp .env.example .env && sed -i 's/^EWIKI_UID=.*/EWIKI_UID=1000/; s/^EWIKI_GID=.*/EWIKI_GID=1000/' .env
          COMPOSE_PROFILES=proxy docker compose config -q
          docker compose config -q
          CROWDSEC_BOUNCER_KEY=ci EWIKI_CROWDSEC_PASSWORD=ci COMPOSE_PROFILES=proxy COMPOSE_FILE=docker-compose.yml:docker-compose.crowdsec.yml docker compose config -q

  office:
    name: Office servers (real Collabora Online and OnlyOffice Docs)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ inputs.latest && 'latest' || '19' }} # renovate: postgres 19
        env: { POSTGRES_USER: wiki, POSTGRES_PASSWORD: wiki, POSTGRES_DB: wiki }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Go version from go.mod
        id: gover
        run: echo "version=$(sed -n 's/^toolchain go//p' go.mod | grep . || sed -n 's/^go //p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with: { go-version: "${{ steps.gover.outputs.version }}" }
      - name: start Collabora Online and OnlyOffice Docs for the examples
        run: |
          tests/office/start.sh > /tmp/office.env
          # the generated secret never appears in the log
          sed -n 's/^export EWIKI_TEST_[A-Z_]*SECRET=\(.*\)$/::add-mask::\1/p' /tmp/office.env
          sed 's/^export //' /tmp/office.env >> "$GITHUB_ENV"
          rm /tmp/office.env
      - name: examples of the action register that need the office servers (and the discovery of Microsoft 365)
        run: go test -race -count=1 -timeout 20m -run 'TestActionExamples' ./internal/server/
        env:
          EWIKI_TEST_EXAMPLE_SYSTEMS: collabora,onlyoffice,microsoft365
          EWIKI_TEST_MICROSOFT365_URL: https://onenote.officeapps.live.com/hosting/discovery
          EWIKI_TEST_DATABASE_URL: ${{ env.DB_URL }}
      - name: stop the office servers of the examples
        if: always()
        run: tests/office/start.sh stop
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: "26" }
      - name: install browser tooling
        working-directory: web
        # the package mirrors fail now and then: up to three tries
        run: |
          npm ci --no-audit --no-fund
          for try in 1 2 3; do npx playwright install --with-deps chromium && break; [ "$try" = 3 ] && exit 1; sleep $((try * 30)); done
      - name: open, edit and save documents in both office servers
        run: |
          # the test host names (browser and test client)
          echo "127.0.0.1 wiki.test office.test docs.test" | sudo tee -a /etc/hosts
          scripts/test-docker-office.sh
      - name: screenshots and logs of a failed office test
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: office-test
          path: |
            /tmp/office-*.png
            /tmp/office-logs/
          retention-days: 7

  auth:
    name: Sign-in against real systems (Keycloak OIDC and SAML, OpenLDAP, Active Directory, Shibboleth SP)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ inputs.latest && 'latest' || '19' }} # renovate: postgres 19
        env: { POSTGRES_USER: wiki, POSTGRES_PASSWORD: wiki, POSTGRES_DB: wiki }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      EWIKI_CONFIG: /tmp/wiki/config.yaml
      EWIKI_DATABASE_URL: postgres://wiki:wiki@localhost:5432/wiki?sslmode=disable
      EWIKI_ADMIN_PASSWORD: Admin-Passw0rd!
      EWIKI_TEST_REQUIRE_REAL_AUTH: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Go version from go.mod
        id: gover
        run: echo "version=$(sed -n 's/^toolchain go//p' go.mod | grep . || sed -n 's/^go //p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with: { go-version: "${{ steps.gover.outputs.version }}" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: "26" }
      # Keycloak needs Java 21
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with: { distribution: temurin, java-version: "21" }
      - name: OpenLDAP, Samba (Active Directory), Apache with mod_shib
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q slapd ldap-utils samba-ad-dc apache2 libapache2-mod-shib
          # the packages start their own services; the test starts its own instances
          sudo systemctl disable --now slapd samba-ad-dc smbd nmbd winbind apache2 shibd 2>/dev/null || true
      - name: start Keycloak, OpenLDAP, Active Directory and Apache with mod_shib
        run: |
          EWIKI_AUTH_AD=1 EWIKI_AUTH_SHIB=1 tests/auth/start.sh > /tmp/auth.env
          # the generated passwords never appear in the log
          sed -n 's/^export EWIKI_TEST_[A-Z_]*PASSWORD=\(.*\)$/::add-mask::\1/p' /tmp/auth.env
          sed 's/^export //' /tmp/auth.env >> "$GITHUB_ENV"
          rm /tmp/auth.env
      # the Go tests reset their database: an own one, so that nothing they
      # leave behind reaches the wiki of the browser test below
      - name: database of the Go tests
        run: PGPASSWORD=wiki psql -h localhost -U wiki -d wiki -c 'CREATE DATABASE wiki_gotest'
      - name: Go tests against the real systems (race detector)
        run: go test -race -count=1 -timeout 30m -run 'TestReal' -v ./internal/server/
        env:
          EWIKI_TEST_DATABASE_URL: postgres://wiki:wiki@localhost:5432/wiki_gotest?sslmode=disable
      - name: examples of the action register that need LDAP or Keycloak
        run: go test -race -count=1 -timeout 20m -run 'TestActionExamples' ./internal/server/
        env:
          EWIKI_TEST_EXAMPLE_SYSTEMS: ldap,keycloak
          EWIKI_TEST_DATABASE_URL: postgres://wiki:wiki@localhost:5432/wiki_gotest?sslmode=disable
      - name: build and start the wiki
        run: |
          (cd web && npm ci --no-audit --no-fund)
          ./scripts/build.sh
          mkdir -p /tmp/wiki
          ./bin/ewiki setup --non-interactive
          nohup ./bin/ewiki serve > /tmp/wiki/server.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:8080/readyz && break; sleep 1; done
      - name: install browser
        working-directory: web
        # the package mirrors fail now and then: up to three tries
        run: for try in 1 2 3; do npx playwright install --with-deps chromium && break; [ "$try" = 3 ] && exit 1; sleep $((try * 30)); done
      - name: browser test (sign in at Keycloak, single logout, axe)
        working-directory: web
        run: npm run test:auth
        env:
          EWIKI_E2E_URL: http://localhost:8080
      - name: logs of a failed test
        if: failure()
        run: |
          tail -n 80 /tmp/wiki/server.log || true
          tail -n 80 /tmp/ewiki-auth/keycloak.log || true
          tail -n 40 /tmp/ewiki-auth/slapd.log || true
          tail -n 40 /tmp/ewiki-auth/samba.log || true
          tail -n 40 /tmp/ewiki-auth/shib/shibd.log /tmp/ewiki-auth/shib/apache-error.log || true
      - name: stop the systems
        if: always()
        run: tests/auth/start.sh stop

  search:
    name: External search against real engines (OpenSearch, Elasticsearch, Meilisearch)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ inputs.latest && 'latest' || '19' }} # renovate: postgres 19
        env: { POSTGRES_USER: wiki, POSTGRES_PASSWORD: wiki, POSTGRES_DB: wiki }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      EWIKI_TEST_REQUIRE_REAL_SEARCH: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Go version from go.mod
        id: gover
        run: echo "version=$(sed -n 's/^toolchain go//p' go.mod | grep . || sed -n 's/^go //p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with: { go-version: "${{ steps.gover.outputs.version }}" }
      # the downloads of the engines (their versions are in start.sh): from
      # the cache, so a broken download rarely stops the job
      - name: downloads of the engines (cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/ewiki-search/*.tgz
            /tmp/ewiki-search/meilisearch-*
          key: search-downloads-${{ hashFiles('tests/search/start.sh') }}
      - name: start OpenSearch, Elasticsearch and Meilisearch
        run: |
          tests/search/start.sh > /tmp/search.env
          # the generated keys and passwords never appear in the log
          sed -n 's/^export EWIKI_TEST_[A-Z_]*\(PASSWORD\|KEY\)=\(.*\)$/::add-mask::\2/p' /tmp/search.env
          sed 's/^export //' /tmp/search.env >> "$GITHUB_ENV"
          rm /tmp/search.env
      - name: Go tests against the real engines (race detector)
        run: go test -race -count=1 -timeout 20m -run 'TestRealExternalSearch' -v ./internal/server/
        env:
          EWIKI_TEST_DATABASE_URL: ${{ env.DB_URL }}
      - name: examples of the action register that need the search engines
        run: go test -race -count=1 -timeout 20m -run 'TestActionExamples' ./internal/server/
        env:
          EWIKI_TEST_EXAMPLE_SYSTEMS: opensearch,elasticsearch,meilisearch
          EWIKI_TEST_DATABASE_URL: ${{ env.DB_URL }}
      - name: logs of a failed test
        if: failure()
        run: tail -n 60 /tmp/ewiki-search/*.log || true
      - name: stop the engines
        if: always()
        run: tests/search/start.sh stop

  crowdsec:
    name: CrowdSec (real Local API, exchange script)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ inputs.latest && 'latest' || '19' }} # renovate: postgres 19
        env: { POSTGRES_USER: wiki, POSTGRES_PASSWORD: wiki, POSTGRES_DB: wiki }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      EWIKI_TEST_REQUIRE_CROWDSEC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Go version from go.mod
        id: gover
        run: echo "version=$(sed -n 's/^toolchain go//p' go.mod | grep . || sed -n 's/^go //p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with: { go-version: "${{ steps.gover.outputs.version }}" }
      - name: download of CrowdSec (cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ewiki-crowdsec/bin-*
          key: crowdsec-${{ hashFiles('tests/crowdsec/start.sh') }}
      - name: start CrowdSec and the exchange script
        run: |
          tests/crowdsec/start.sh > /tmp/crowdsec.env
          # the generated password never appears in the log
          sed -n 's/^export EWIKI_TEST_CROWDSEC_PASSWORD=\(.*\)$/::add-mask::\1/p' /tmp/crowdsec.env
          sed -e 's/^export //' -e "s/^\(EWIKI_TEST_CROWDSEC_CSCLI=\)'\(.*\)'$/\1\2/" /tmp/crowdsec.env >> "$GITHUB_ENV"
          rm /tmp/crowdsec.env
      - name: Go tests against CrowdSec (race detector)
        run: go test -race -count=1 -timeout 20m -run 'TestCrowdSec' -v ./internal/server/
        env:
          EWIKI_TEST_DATABASE_URL: ${{ env.DB_URL }}
      - name: examples of the action register that need CrowdSec
        run: go test -race -count=1 -timeout 20m -run 'TestActionExamples' ./internal/server/
        env:
          EWIKI_TEST_EXAMPLE_SYSTEMS: crowdsec
          EWIKI_TEST_DATABASE_URL: ${{ env.DB_URL }}
      - name: logs of a failed test
        if: failure()
        run: tail -n 60 /tmp/ewiki-crowdsec/*.log || true
      - name: stop CrowdSec
        if: always()
        run: tests/crowdsec/start.sh stop

  plugins:
    name: Plugin lifecycle (private source, build, restart, update)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ inputs.latest && 'latest' || '19' }} # renovate: postgres 19
        env: { POSTGRES_USER: wiki, POSTGRES_PASSWORD: wiki, POSTGRES_DB: wiki }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Go version from go.mod
        id: gover
        run: echo "version=$(sed -n 's/^toolchain go//p' go.mod | grep . || sed -n 's/^go //p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with: { go-version: "${{ steps.gover.outputs.version }}" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: "26" }
      - name: the token of the test plugin can only read that repository
        run: tests/plugins/token_check.sh
        env:
          EWIKI_TESTPLUGIN_TOKEN: ${{ secrets.EWIKI_TESTPLUGIN_TOKEN }}
      # the real chain with the private test plugin: access data, install,
      # build, restart, update check, update (tests/plugins/lifecycle.sh)
      - name: install, build, restart and update a core plugin from a private repository
        run: tests/plugins/lifecycle.sh
        env:
          EWIKI_TESTPLUGIN_TOKEN: ${{ secrets.EWIKI_TESTPLUGIN_TOKEN }}
          EWIKI_DATABASE_URL: postgres://wiki:wiki@localhost:5432/wiki?sslmode=disable
      - name: server log
        if: failure()
        run: tail -n 100 /tmp/ewiki-lifecycle/server.log || true

  pg-versions:
    name: PostgreSQL versions for the upgrade test
    runs-on: ubuntu-latest
    outputs:
      from: ${{ steps.v.outputs.from }}
      oldest: ${{ steps.v.outputs.oldest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # the two major versions before the recommended one (internal/pgversion,
      # updated by Renovate): with 19 recommended the test runs 17 → 19 and 18 → 19
      - id: v
        run: |
          r=$(sed -nE 's/^const RecommendedMajor = ([0-9]+).*/\1/p' internal/pgversion/pgversion.go)
          [ -n "$r" ] || { echo "RecommendedMajor not found"; exit 1; }
          echo "from=[\"$((r-2))\",\"$((r-1))\"]" >> "$GITHUB_OUTPUT"
          echo "oldest=$((r-2))" >> "$GITHUB_OUTPUT"
          echo "recommended $r, upgrade test from $((r-2)) and $((r-1))"

  compose:
    name: Docker Compose – setup, non-root, PostgreSQL upgrade ${{ matrix.from }} → recommended
    needs: pg-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        from: ${{ fromJSON(needs.pg-versions.outputs.from) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: upgrade test with the official images (copy and --link)
        run: scripts/test-docker-postgres.sh ${{ matrix.from }} ${{ matrix.from == needs.pg-versions.outputs.oldest && '--full' || '' }}

  # One stable check for the branch protection of main: the names of the
  # matrix jobs change with the PostgreSQL versions, this one never does.
  result:
    name: CI result
    if: always()
    needs: [backend, security, e2e, docker, office, auth, search, crowdsec, plugins, pg-versions, compose]
    runs-on: ubuntu-latest
    steps:
      - name: all jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
